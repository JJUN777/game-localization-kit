<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GLK 번역 검수</title>
  <link rel="stylesheet" href="/assets/tokens.css">
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font: 14px/1.55 Inter, Pretendard, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 20px;
      min-height: 74px;
      padding: 12px 24px;
      color: var(--ink);
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 96%, transparent);
      backdrop-filter: none;
      box-shadow: none;
    }
    .brand { min-width: 230px; }
    .eyebrow {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 { margin: 1px 0 0; font-size: 19px; line-height: 1.2; }
    .header-summary {
      display: flex;
      flex: 1;
      gap: 8px;
      align-items: center;
      overflow-x: auto;
    }
    .metric {
      min-width: 76px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 0;
      border-width: 0 1px 0 0;
      border-color: var(--line);
      background: transparent;
    }
    .metric strong { display: block; font-size: 16px; }
    .metric span { color: var(--muted); font-size: 11px; }
    .header-actions { display: flex; gap: 8px; }
    .button {
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 9px 13px;
      font-weight: 700;
      transition: transform .15s ease, background .15s ease, opacity .15s ease;
    }
    .button:hover { opacity: .82; }
    .button:disabled { cursor: not-allowed; opacity: .45; }
    .button-primary { color: var(--on-solid); border-color: var(--ink); background: var(--ink); }
    .button-primary:hover { background: var(--ink-soft); }
    .button-secondary {
      color: var(--ink);
      border-color: var(--line);
      background: var(--surface);
    }
    .button-success { color: var(--on-solid); border-color: var(--ink); background: var(--ink); }
    .button-warning { color: var(--on-solid); border-color: var(--error); background: var(--error); }
    .layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: calc(100vh - 74px);
    }
    .sidebar {
      position: sticky;
      top: 74px;
      align-self: start;
      height: calc(100vh - 74px);
      padding: 20px 16px;
      border-right: 1px solid var(--line);
      background: var(--surface);
      overflow: auto;
    }
    .search {
      width: 100%;
      padding: 10px 12px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 6px;
      outline: none;
      background: var(--surface);
    }
    .search:focus { border-color: var(--line-strong); box-shadow: none; }
    .filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 18px; }
    .filter {
      padding: 5px 9px;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      font-size: 12px;
    }
    .filter.active { color: var(--on-solid); border-color: var(--ink); background: var(--ink); }
    .sidebar-title {
      margin: 14px 4px 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .block-nav { display: grid; gap: 5px; }
    .block-link {
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      width: 100%;
      padding: 8px;
      color: var(--ink);
      border: 0;
      border-radius: 6px;
      text-align: left;
      background: transparent;
    }
    .block-link:hover { background: var(--soft); }
    .block-link .order { color: var(--muted); font-size: 11px; }
    .block-link .snippet { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); }
    .dot.error { background: var(--error); }
    .dot.warning { background: var(--warning); }
    .dot.changed { background: var(--ink-soft); }
    main { width: min(1240px, 100%); padding: 26px 30px 80px; margin: 0 auto; }
    .intro {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: end;
      margin-bottom: 18px;
    }
    .intro h2 { margin: 0 0 5px; font-size: 24px; }
    .intro p { margin: 0; color: var(--muted); }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      color: var(--ink-soft);
      border-radius: 999px;
      background: var(--soft);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .general-issues { margin-bottom: 16px; }
    .retry-job {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px 18px;
      align-items: center;
      margin-bottom: 16px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
    }
    .retry-job.failed {
      border-color: rgb(216 92 65 / 28%);
      background: var(--error-bg);
    }
    .retry-job.succeeded {
      border-color: color-mix(in srgb, var(--success) 35%, var(--line));
      background: var(--success-bg);
    }
    .retry-job-copy { min-width: 0; }
    .retry-job-title {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 4px;
      font-weight: 700;
    }
    .retry-job-status {
      padding: 2px 7px;
      color: var(--ink-soft);
      border-radius: 999px;
      background: var(--line);
      font-size: 11px;
    }
    .retry-job.failed .retry-job-status {
      color: var(--error);
      background: var(--accent-soft);
    }
    .retry-job.succeeded .retry-job-status {
      color: var(--success);
      background: var(--success-soft);
    }
    .retry-job-message { color: var(--muted); font-size: 12px; }
    .retry-job-error {
      margin-top: 5px;
      color: var(--error);
      font-size: 12px;
      overflow-wrap: anywhere;
    }
    .retry-job-usage {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .retry-progress {
      grid-column: 1 / -1;
      height: 6px;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
    }
    .retry-progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--ink-soft);
      transition: width .25s ease;
    }
    .retry-job.failed .retry-progress-bar { background: var(--error); }
    .retry-job.succeeded .retry-progress-bar { background: var(--success); }
    .review-card {
      scroll-margin-top: 96px;
      margin-bottom: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: none;
      overflow: hidden;
    }
    .review-card.has-error,
    .review-card.has-warning { border-color: rgb(216 92 65 / 36%); }
    .card-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-hover);
    }
    .identity { min-width: 0; }
    .identity strong { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .identity .location { margin-left: 8px; color: var(--muted); font-size: 12px; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .badge {
      padding: 3px 7px;
      border-radius: 999px;
      color: var(--muted);
      background: var(--line);
      font-size: 11px;
      font-weight: 600;
    }
    .badge.error { color: var(--error); background: var(--error-bg); }
    .badge.warning { color: var(--warning); background: var(--warning-bg); }
    .badge.info { color: var(--success); background: var(--success-bg); }
    .badge.changed { color: var(--ink-soft); background: var(--soft); }
    .columns { display: grid; grid-template-columns: 1fr 1fr; }
    .pane { min-width: 0; padding: 16px; }
    .pane + .pane { border-left: 1px solid var(--line); }
    .pane-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .source-text {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: 14px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .source-text mark {
      padding: 1px 2px;
      color: inherit;
      border-radius: 3px;
      background: var(--line);
    }
    .translation-input {
      display: block;
      width: 100%;
      min-height: 128px;
      padding: 12px;
      resize: vertical;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 6px;
      outline: none;
      background: var(--surface);
      line-height: 1.7;
    }
    .translation-input:focus {
      border-color: var(--line-strong);
      box-shadow: none;
    }
    .issues { display: grid; gap: 6px; padding: 0 16px 14px; }
    .issue {
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    .issue.error { color: var(--accent-dark); background: var(--error-bg); }
    .issue.warning { color: var(--accent-dark); background: var(--warning-bg); }
    .issue.info { color: var(--success-dark); background: var(--success-bg); }
    .term-context {
      display: grid;
      gap: 9px;
      padding: 12px 16px 14px;
      border-top: 1px solid var(--line);
      background: var(--surface-hover);
    }
    .term-context-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .term-context-title {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .term-context-open {
      padding: 4px 8px;
      color: var(--ink-soft);
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      font-size: 11px;
      font-weight: 600;
    }
    .term-rules {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .term-rule {
      display: inline-grid;
      grid-template-columns: auto auto auto;
      gap: 6px;
      align-items: center;
      padding: 7px 9px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 6px;
      text-align: left;
      background: var(--surface);
    }
    .term-rule:hover { border-color: var(--ink); }
    .term-rule-status {
      padding: 2px 5px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
    }
    .term-rule-status.approved { color: var(--success); background: var(--success-bg); }
    .term-rule-status.keep { color: var(--ink-soft); background: var(--soft); }
    .term-rule-source { font-weight: 700; }
    .term-rule-target { color: var(--muted); font-size: 12px; }
    .termbase-dialog {
      width: min(780px, calc(100vw - 32px));
      max-height: min(760px, calc(100vh - 40px));
      overflow: auto;
    }
    .termbase-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }
    .termbase-head .button { color: var(--ink); }
    .termbase-tools {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      margin-bottom: 14px;
    }
    .termbase-filters { display: flex; gap: 6px; align-items: center; }
    .termbase-list { display: grid; gap: 8px; }
    .termbase-row {
      display: grid;
      grid-template-columns: minmax(140px, .8fr) minmax(160px, 1fr);
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-hover);
    }
    .termbase-row strong { display: block; overflow-wrap: anywhere; }
    .termbase-row-target { color: var(--ink-soft); font-weight: 700; }
    .termbase-meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      overflow-wrap: anywhere;
    }
    .empty {
      padding: 54px 20px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: color-mix(in srgb, var(--surface) 60%, transparent);
    }
    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 50;
      max-width: 420px;
      padding: 12px 16px;
      color: var(--on-solid);
      border-radius: 8px;
      background: var(--ink);
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: .2s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { background: var(--error); }
    .loading {
      display: grid;
      place-items: center;
      min-height: 60vh;
      color: var(--muted);
    }
    dialog {
      width: min(480px, calc(100vw - 32px));
      padding: 24px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow-dialog);
    }
    dialog::backdrop { background: var(--overlay); }
    dialog h2 { margin: 0 0 10px; font-size: 21px; }
    dialog p { margin: 0; color: var(--muted); }
    dialog textarea {
      width: 100%;
      min-height: 92px;
      margin-top: 14px;
      padding: 10px 12px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 6px;
      resize: vertical;
    }
    dialog .button-secondary {
      color: var(--ink);
      border-color: var(--line);
      background: var(--surface);
    }
    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 22px;
    }
    .hidden { display: none !important; }
    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    summary:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    .search:focus-visible,
    .translation-input:focus-visible {
      border-color: var(--focus);
    }
    @media (max-width: 900px) {
      .app-header { align-items: flex-start; flex-wrap: wrap; }
      .brand { min-width: 0; flex: 1; }
      .header-summary { order: 3; width: 100%; }
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      .block-nav { display: none; }
      main { padding: 20px 14px 70px; }
      .columns { grid-template-columns: 1fr; }
      .pane + .pane { border-left: 0; border-top: 1px solid var(--line); }
      .header-actions { width: 100%; }
      .header-actions .button { flex: 1; }
      .termbase-tools, .termbase-row { grid-template-columns: 1fr; }
      .termbase-filters { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="eyebrow">Game Localization Kit</div>
      <h1 id="project-name">번역 검수</h1>
    </div>
    <div class="header-summary" id="header-summary"></div>
    <div class="header-actions">
      <button class="button button-secondary" id="termbase-button">용어집</button>
      <button class="button button-secondary" id="save-button">저장</button>
      <button class="button button-primary" id="qa-button">저장 후 QA</button>
      <button class="button button-secondary" id="retry-button">오류만 재번역</button>
      <button class="button button-warning hidden" id="qa-override-button">
        QA 오류 예외 승인
      </button>
      <button class="button button-success" id="finalize-button">최종 승인</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <input class="search" id="search" type="search" placeholder="원문·번역·block 검색">
      <div class="filters" id="filters">
        <button class="filter active" data-filter="all">전체</button>
        <button class="filter" data-filter="error">오류</button>
        <button class="filter" data-filter="warning">경고</button>
        <button class="filter" data-filter="changed">수정됨</button>
      </div>
      <div class="sidebar-title">Visible blocks</div>
      <nav class="block-nav" id="block-nav"></nav>
    </aside>
    <main>
      <div class="intro">
        <div>
          <h2>원문과 번역을 함께 검수하세요</h2>
          <p>원문은 읽기 전용입니다. 번역문 저장 시 marker 구조는 프로그램이 다시 생성합니다.</p>
        </div>
        <span class="status-pill" id="review-status">불러오는 중</span>
      </div>
      <div class="general-issues" id="general-issues"></div>
      <section class="retry-job hidden" id="retry-job" aria-live="polite">
        <div class="retry-job-copy">
          <div class="retry-job-title">
            <span>오류 문장 재번역</span>
            <span class="retry-job-status" id="retry-job-status"></span>
          </div>
          <div class="retry-job-message" id="retry-job-message"></div>
          <div class="retry-job-usage hidden" id="retry-job-usage"></div>
          <div class="retry-job-error hidden" id="retry-job-error"></div>
        </div>
        <div class="retry-job-count" id="retry-job-count"></div>
        <div class="retry-progress">
          <div class="retry-progress-bar" id="retry-progress-bar"></div>
        </div>
      </section>
      <section id="content"><div class="loading">검수 데이터를 불러오는 중입니다…</div></section>
    </main>
  </div>
  <dialog id="translationCompleteDialog" aria-labelledby="translationCompleteTitle">
    <h2 id="translationCompleteTitle">최종 번역 승인이 완료되었습니다</h2>
    <p>
      대시보드에서 최종 번역 완료 상태와 생성된 출력 파일을 확인할 수 있습니다.
    </p>
    <div class="dialog-actions">
      <button class="button button-secondary" id="stayAfterFinalize" type="button">
        이 화면에 머물기
      </button>
      <button class="button button-primary" id="returnDashboard" type="button">
        대시보드로 돌아가기
      </button>
    </div>
  </dialog>
  <dialog id="qaOverrideDialog" aria-labelledby="qaOverrideTitle">
    <h2 id="qaOverrideTitle">QA 오류를 예외 승인하시겠습니까?</h2>
    <p id="qaOverrideSummary"></p>
    <textarea id="qaOverrideReason" maxlength="1000"
      placeholder="예: 영문 월 이름을 한국어 숫자 월 표기로 번역했음을 확인함"></textarea>
    <div class="dialog-actions">
      <button class="button button-secondary" id="cancelQaOverride" type="button">
        취소
      </button>
      <button class="button button-warning" id="confirmQaOverride" type="button">
        예외 승인 후 최종 승인
      </button>
    </div>
  </dialog>
  <dialog class="termbase-dialog" id="termbaseDialog"
    aria-labelledby="termbaseDialogTitle">
    <div class="termbase-head">
      <div>
        <h2 id="termbaseDialogTitle">확정 용어집</h2>
        <p>번역에 적용되는 확정 번역과 원문 유지 용어를 검색합니다.</p>
      </div>
      <button class="button button-secondary" id="termbaseDialogClose"
        type="button">닫기</button>
    </div>
    <div class="termbase-tools">
      <input class="search" id="termbase-search" type="search"
        placeholder="원문 용어·번역어·표기 변형 검색">
      <div class="termbase-filters" id="termbase-filters">
        <button class="filter active" data-term-filter="all" type="button">전체</button>
        <button class="filter" data-term-filter="approved" type="button">확정 번역</button>
        <button class="filter" data-term-filter="keep" type="button">원문 유지</button>
      </div>
    </div>
    <div class="termbase-list" id="termbase-list"></div>
  </dialog>
  <div class="toast" id="toast"></div>
  <script>
    "use strict";
    const AUTH_TOKEN = __GLK_TOKEN_JSON__;
    const RETURN_URL = __GLK_RETURN_URL_JSON__;
    const state = {
      document: null,
      filter: "all",
      search: "",
      termFilter: "all",
      termSearch: "",
      dirty: false,
      busy: false,
      retryJob: null,
      watchedRetryJobId: null,
      retryPollTimer: null
    };
    const $ = (selector) => document.querySelector(selector);

    async function api(path, options = {}) {
      const headers = Object.assign(
        { "X-GLK-Token": AUTH_TOKEN },
        options.body ? { "Content-Type": "application/json" } : {},
        options.headers || {}
      );
      const response = await fetch(path, Object.assign({}, options, { headers }));
      const payload = await response.json().catch(() => ({ message: "응답을 읽을 수 없습니다." }));
      if (!response.ok) throw new Error(payload.message || `HTTP ${response.status}`);
      return payload;
    }

    function toast(message, error = false) {
      const node = $("#toast");
      node.textContent = message;
      node.className = `toast show${error ? " error" : ""}`;
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => { node.className = "toast"; }, 2800);
    }

    function issueLevel(block, level) {
      return block.issues.some((issue) => issue.severity === level);
    }

    function visible(block) {
      const filterMatch =
        state.filter === "all" ||
        (state.filter === "error" && issueLevel(block, "error")) ||
        (state.filter === "warning" && issueLevel(block, "warning")) ||
        (state.filter === "changed" && block.changed);
      if (!filterMatch) return false;
      const query = state.search.trim().toLocaleLowerCase();
      if (!query) return true;
      const terms = (block.relevant_terms || []).flatMap((term) => [
        term.source_term,
        term.translation,
        ...(term.variants || [])
      ]);
      return [block.id, block.source, block.translation, block.source_file, ...terms]
        .join("\n").toLocaleLowerCase().includes(query);
    }

    function make(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    const termStatusLabel = (status) =>
      status === "keep" ? "원문 유지" : "확정 번역";

    function termTargetLabel(term) {
      return term.status === "keep"
        ? "영문 그대로"
        : `→ ${term.translation || "(번역어 없음)"}`;
    }

    const isWordCharacter = (value) =>
      Boolean(value) && /[\p{L}\p{N}_]/u.test(value);

    function termRanges(text, variants) {
      const ranges = [];
      const occupied = [];
      [...new Set(variants || [])]
        .filter(Boolean)
        .sort((left, right) => right.length - left.length)
        .forEach((variant) => {
          const source = text.toLocaleLowerCase();
          const needle = variant.toLocaleLowerCase();
          let offset = 0;
          while (offset <= source.length - needle.length) {
            const start = source.indexOf(needle, offset);
            if (start < 0) break;
            const end = start + needle.length;
            const startsWithWord = isWordCharacter(variant[0]);
            const endsWithWord = isWordCharacter(variant[variant.length - 1]);
            const boundaryOk =
              (!startsWithWord || !isWordCharacter(text[start - 1])) &&
              (!endsWithWord || !isWordCharacter(text[end]));
            const overlaps = occupied.some(
              ([usedStart, usedEnd]) => start < usedEnd && end > usedStart
            );
            if (boundaryOk && !overlaps) {
              ranges.push([start, end]);
              occupied.push([start, end]);
            }
            offset = start + Math.max(needle.length, 1);
          }
        });
      return ranges.sort((left, right) => left[0] - right[0]);
    }

    function highlightSourceTerm(node, text, term) {
      const ranges = termRanges(text, term.variants || [term.source_term]);
      node.replaceChildren();
      if (!ranges.length) {
        node.textContent = text;
        return;
      }
      let cursor = 0;
      ranges.forEach(([start, end]) => {
        if (cursor < start) node.append(document.createTextNode(text.slice(cursor, start)));
        node.append(make("mark", "", text.slice(start, end)));
        cursor = end;
      });
      if (cursor < text.length) node.append(document.createTextNode(text.slice(cursor)));
    }

    function selectTranslationTerm(textarea, term) {
      const candidates = term.status === "keep"
        ? (term.variants || [])
        : [term.translation];
      const text = textarea.value.toLocaleLowerCase();
      const match = candidates
        .filter(Boolean)
        .map((candidate) => ({
          candidate,
          index: text.indexOf(candidate.toLocaleLowerCase())
        }))
        .find((item) => item.index >= 0);
      textarea.focus();
      if (match) {
        textarea.setSelectionRange(
          match.index,
          match.index + match.candidate.length
        );
      } else {
        toast("번역문에서 해당 용어 표기를 찾지 못했습니다.", true);
      }
    }

    function termRuleButton(term, onClick) {
      const button = make("button", "term-rule");
      button.type = "button";
      const status = make(
        "span",
        `term-rule-status ${term.status}`,
        termStatusLabel(term.status)
      );
      button.append(
        status,
        make("span", "term-rule-source", term.source_term),
        make("span", "term-rule-target", termTargetLabel(term))
      );
      button.title = (term.variants || []).join(" · ");
      button.addEventListener("click", onClick);
      return button;
    }

    function renderTermbase() {
      if (!state.document) return;
      const query = state.termSearch.trim().toLocaleLowerCase();
      const terms = (state.document.termbase || []).filter((term) => {
        if (state.termFilter !== "all" && term.status !== state.termFilter) {
          return false;
        }
        if (!query) return true;
        return [
          term.source_term,
          term.translation,
          term.category,
          term.note,
          ...(term.variants || [])
        ].join("\n").toLocaleLowerCase().includes(query);
      });
      const list = $("#termbase-list");
      list.replaceChildren();
      if (!terms.length) {
        list.append(make("div", "empty", "조건에 맞는 확정 용어가 없습니다."));
        return;
      }
      terms.forEach((term) => {
        const row = make("article", "termbase-row");
        const source = make("div");
        source.append(
          make(
            "span",
            `term-rule-status ${term.status}`,
            termStatusLabel(term.status)
          ),
          make("strong", "", term.source_term)
        );
        const variants = (term.variants || []).join(" · ");
        if (variants) {
          source.append(make("div", "termbase-meta", `표기 변형: ${variants}`));
        }
        const target = make("div");
        target.append(
          make(
            "div",
            "termbase-row-target",
            term.status === "keep"
              ? "원문 표기를 그대로 유지"
              : term.translation || "(번역어 없음)"
          )
        );
        const metadata = [term.category, term.note].filter(Boolean).join(" · ");
        if (metadata) target.append(make("div", "termbase-meta", metadata));
        row.append(source, target);
        list.append(row);
      });
    }

    function openTermbase() {
      renderTermbase();
      $("#termbaseDialog").showModal();
      $("#termbase-search").focus();
    }

    function metric(value, label) {
      const node = make("div", "metric");
      node.append(make("strong", "", String(value)), make("span", "", label));
      return node;
    }

    const issueLabels = {
      invalid_encoding: "파일 인코딩",
      invalid_header: "파일 형식",
      location_changed: "위치 표시",
      block_order_changed: "Block 순서",
      original_marker_changed: "원문 표시",
      source_changed: "원문 변경",
      translation_marker_changed: "번역 표시",
      end_marker_changed: "끝 표시",
      unknown_block: "알 수 없는 Block",
      unexpected_content: "예상 밖 내용",
      empty_translation: "빈 번역",
      replacement_character: "깨진 문자",
      unresolved_illegible: "판독 불가",
      curly_token_changed: "중괄호 Token",
      square_token_changed: "대괄호 Token",
      html_tag_changed: "HTML 태그",
      number_changed: "숫자 불일치",
      approved_term_missing: "확정 용어",
      keep_term_changed: "원문 유지 용어",
      unchanged_translation: "미번역 의심",
      target_script_missing: "한글 없음",
      keep_rule_applied: "원문 유지 적용"
    };
    const issueLabel = (issue) => issueLabels[issue.code] || "확인 필요";

    const retryJobActive = () =>
      Boolean(
        state.retryJob &&
        ["queued", "running"].includes(state.retryJob.status)
      );

    function renderRetryJob() {
      const panel = $("#retry-job");
      const job = state.retryJob;
      panel.classList.toggle("hidden", !job);
      if (!job) return;
      panel.className = `retry-job ${job.status}`;
      const statusLabels = {
        queued: "대기 중",
        running: "진행 중",
        succeeded: "완료",
        failed: "실패 · 재시도 가능"
      };
      $("#retry-job-status").textContent =
        statusLabels[job.status] || "상태 확인 필요";
      $("#retry-job-message").textContent = job.progress_message;
      const usage = job.result?.usage;
      const usageNode = $("#retry-job-usage");
      if (usage && Number.isInteger(usage.requests) && usage.requests > 0) {
        const compact = (value) => new Intl.NumberFormat(
          "ko-KR",
          {notation: "compact"}
        ).format(Number.isInteger(value) ? value : 0);
        const cost = Number.isFinite(usage.estimated_cost_usd)
          ? ` · 예상 $${usage.estimated_cost_usd.toFixed(4)}`
          : " · 단가 미등록";
        usageNode.textContent =
          `API ${usage.requests}회 · 입력 ${compact(usage.input_tokens)}` +
          ` · 출력 ${compact(usage.output_tokens)}${cost}`;
        usageNode.classList.remove("hidden");
      } else {
        usageNode.textContent = "";
        usageNode.classList.add("hidden");
      }
      const error = $("#retry-job-error");
      error.textContent = job.error || "";
      error.classList.toggle("hidden", !job.error);
      const current = job.progress_current;
      const total = job.progress_total;
      $("#retry-job-count").textContent =
        Number.isInteger(current) && Number.isInteger(total)
          ? `${current} / ${total}`
          : retryJobActive() ? "처리 중" : "";
      const percent =
        Number.isInteger(current) && Number.isInteger(total) && total > 0
          ? Math.min(100, Math.max(0, current / total * 100))
          : retryJobActive() ? 12 : job.status === "succeeded" ? 100 : 0;
      $("#retry-progress-bar").style.width = `${percent}%`;
    }

    function refreshSummary() {
      const doc = state.document;
      const interactionBusy = state.busy || retryJobActive();
      const changed = doc.blocks.filter((block) => block.changed).length;
      doc.summary.changed = changed;
      const summary = $("#header-summary");
      summary.replaceChildren(
        metric(doc.summary.blocks, "blocks"),
        metric(changed, "수정됨"),
        metric(doc.summary.errors, "오류"),
        metric(doc.summary.warnings, "경고")
      );
      const reviewStatusLabel = {
        not_ready: "준비 전",
        pending: "검수 대기",
        current: "최신 상태",
        stale: "업데이트 필요",
        qa_failed: "QA 확인 필요",
        qa_passed: "QA 통과",
        approved: "승인 완료"
      }[doc.review_status] || "상태 확인 필요";
      $("#review-status").textContent =
        `${reviewStatusLabel}${state.dirty ? " · 저장 안 됨" : ""}`;
      $("#finalize-button").disabled =
        interactionBusy || state.dirty || doc.summary.errors > 0;
      const overrideButton = $("#qa-override-button");
      const hasErrors = doc.summary.errors > 0;
      const overrideAllowed =
        hasErrors && doc.summary.blocking_errors === 0;
      overrideButton.classList.toggle("hidden", !hasErrors);
      overrideButton.disabled =
        interactionBusy || state.dirty || !overrideAllowed;
      overrideButton.textContent = doc.summary.blocking_errors > 0
        ? `빈 번역 ${doc.summary.blocking_errors}개 입력 필요`
        : `QA 오류 ${doc.summary.overridable_errors}개 예외 승인`;
      $("#save-button").disabled = interactionBusy || !state.dirty;
      $("#qa-button").disabled = interactionBusy;
      $("#retry-button").disabled =
        interactionBusy || doc.summary.errors === 0;
      $("#retry-button").textContent =
        retryJobActive() ? "재번역 진행 중…" :
        state.retryJob?.status === "failed" ? "오류 재번역 다시 시도" :
        "오류만 재번역";
      document.querySelectorAll(".translation-input").forEach((node) => {
        node.disabled = interactionBusy;
      });
      renderRetryJob();
    }

    function blockDot(block) {
      if (issueLevel(block, "error")) return "error";
      if (issueLevel(block, "warning")) return "warning";
      if (block.changed) return "changed";
      return "";
    }

    function render() {
      const doc = state.document;
      document.title = `${doc.project.name} · GLK Review`;
      $("#project-name").textContent = doc.project.name;
      refreshSummary();

      const general = $("#general-issues");
      general.replaceChildren();
      doc.general_issues.forEach((issue) => {
        general.append(make("div", `issue ${issue.severity}`, issue.message));
      });

      const shown = doc.blocks.filter(visible);
      const nav = $("#block-nav");
      const content = $("#content");
      nav.replaceChildren();
      content.replaceChildren();
      if (!shown.length) {
        content.append(make("div", "empty", "조건에 맞는 block이 없습니다."));
        return;
      }

      shown.forEach((block) => {
        const link = make("button", "block-link");
        link.type = "button";
        link.append(
          make("span", "order", String(block.source_order)),
          make("span", "snippet", block.translation || "(빈 번역)"),
          make("span", `dot ${blockDot(block)}`)
        );
        link.addEventListener("click", () => {
          document.getElementById(`block-${block.source_order}`)?.scrollIntoView();
        });
        nav.append(link);

        const levels = new Set(block.issues.map((issue) => issue.severity));
        const cardClass = levels.has("error")
          ? "review-card has-error"
          : levels.has("warning") ? "review-card has-warning" : "review-card";
        const card = make("article", cardClass);
        card.id = `block-${block.source_order}`;

        const header = make("div", "card-header");
        const identity = make("div", "identity");
        identity.append(make("strong", "", block.id));
        const location = block.page
          ? `PAGE ${block.page} · ${block.block_type}`
          : `${block.source_file} · ${block.block_type}`;
        identity.append(make("span", "location", location));
        const badges = make("div", "badges");
        if (block.changed) {
          const changedBadge = make("span", "badge changed", "수정됨");
          changedBadge.dataset.kind = "changed";
          badges.append(changedBadge);
        }
        block.issues.forEach((issue) => {
          const badge = make(
            "span",
            `badge ${issue.severity}`,
            issueLabel(issue)
          );
          badge.title = issue.code;
          badges.append(badge);
        });
        header.append(identity, badges);

        const columns = make("div", "columns");
        const sourcePane = make("section", "pane");
        const sourceText = make("pre", "source-text", block.source);
        sourcePane.append(
          make("div", "pane-label", "Original · 읽기 전용"),
          sourceText
        );
        const translationPane = make("section", "pane");
        const paneLabel = make("div", "pane-label");
        paneLabel.append(
          make("span", "", "Translation"),
          make("span", "", block.changed ? "초벌에서 수정됨" : "초벌과 동일")
        );
        const textarea = make("textarea", "translation-input");
        textarea.value = block.translation;
        textarea.dataset.blockId = block.id;
        textarea.disabled = state.busy || retryJobActive();
        textarea.addEventListener("input", () => {
          block.translation = textarea.value;
          block.changed = block.translation.trim() !== block.draft_translation;
          state.dirty = true;
          paneLabel.lastElementChild.textContent =
            block.changed ? "초벌에서 수정됨" : "초벌과 동일";
          let changedBadge = badges.querySelector('[data-kind="changed"]');
          if (block.changed && !changedBadge) {
            changedBadge = make("span", "badge changed", "수정됨");
            changedBadge.dataset.kind = "changed";
            badges.prepend(changedBadge);
          } else if (!block.changed && changedBadge) {
            changedBadge.remove();
          }
          link.querySelector(".snippet").textContent =
            block.translation || "(빈 번역)";
          link.querySelector(".dot").className = `dot ${blockDot(block)}`;
          refreshSummary();
          card.classList.toggle("edited", block.changed);
        });
        translationPane.append(paneLabel, textarea);
        columns.append(sourcePane, translationPane);
        card.append(header, columns);

        if ((block.relevant_terms || []).length) {
          const termContext = make("section", "term-context");
          const termHead = make("div", "term-context-head");
          termHead.append(
            make(
              "span",
              "term-context-title",
              `이 블록의 적용 용어 ${block.relevant_terms.length}개`
            )
          );
          const openButton = make(
            "button",
            "term-context-open",
            "전체 용어집"
          );
          openButton.type = "button";
          openButton.addEventListener("click", openTermbase);
          termHead.append(openButton);
          const rules = make("div", "term-rules");
          block.relevant_terms.forEach((term) => {
            rules.append(
              termRuleButton(term, () => {
                highlightSourceTerm(sourceText, block.source, term);
                selectTranslationTerm(textarea, term);
              })
            );
          });
          termContext.append(termHead, rules);
          card.append(termContext);
        }

        if (block.issues.length) {
          const issues = make("div", "issues");
          block.issues.forEach((issue) => {
            issues.append(
              make(
                "div",
                `issue ${issue.severity}`,
                `${issueLabel(issue)} · ${issue.message}`
              )
            );
          });
          card.append(issues);
        }
        content.append(card);
      });
    }

    function requestBody(extra = {}) {
      return JSON.stringify(Object.assign({
        review_sha256: state.document.review_sha256,
        translations: Object.fromEntries(
          state.document.blocks.map((block) => [block.id, block.translation])
        )
      }, extra));
    }

    async function runAction(action, extra = {}) {
      if (state.busy) return;
      state.busy = true;
      refreshSummary();
      try {
        const payload = await api(`/api/${action}`, {
          method: "POST",
          body: requestBody(extra)
        });
        state.document = payload.document || payload;
        state.dirty = false;
        render();
        if (action === "save") toast("검수 번역을 저장했습니다.");
        if (action === "qa") {
          const count = payload.result.error_count;
          toast(count ? `QA 오류 ${count}개를 확인하세요.` : "QA를 통과했습니다.", count > 0);
        }
        if (action === "finalize") {
          const finalized = payload.result.finalized;
          const overrideCount = payload.result.qa_errors_overridden
            ? payload.result.error_count
            : 0;
          toast(
            finalized
              ? overrideCount
                ? `QA 오류 ${overrideCount}개를 예외 승인하고 최종 번역을 승인했습니다.`
                : "최종 번역을 승인했습니다."
              : "QA 오류를 먼저 수정하세요.",
            !finalized
          );
          if (finalized) $("#translationCompleteDialog").showModal();
        }
      } catch (error) {
        toast(error.message, true);
      } finally {
        state.busy = false;
        refreshSummary();
      }
    }

    function scheduleRetryPoll() {
      clearTimeout(state.retryPollTimer);
      if (!retryJobActive()) return;
      state.retryPollTimer = setTimeout(pollRetryJob, 700);
    }

    async function reloadReviewAfterRetry(job) {
      const document = await api("/api/review");
      state.document = document;
      state.dirty = false;
      render();
      if (job.status === "succeeded") {
        const result = job.result || {};
        const count = result.retried_blocks || 0;
        const remaining = result.remaining_error_count || 0;
        toast(
          `${count}개 오류 문장을 재번역했습니다. 남은 오류 ${remaining}개.`,
          remaining > 0
        );
      } else {
        toast(job.error || "오류 문장 재번역에 실패했습니다.", true);
      }
    }

    async function pollRetryJob() {
      try {
        const payload = await api("/api/retry-job");
        const previousActive = retryJobActive();
        state.retryJob = payload.job;
        refreshSummary();
        if (
          previousActive &&
          state.retryJob &&
          !retryJobActive() &&
          state.retryJob.job_id === state.watchedRetryJobId
        ) {
          state.watchedRetryJobId = null;
          await reloadReviewAfterRetry(state.retryJob);
        }
      } catch (error) {
        toast(`재번역 상태를 확인하지 못했습니다. ${error.message}`, true);
      }
      scheduleRetryPoll();
    }

    async function startRetry() {
      if (state.busy || retryJobActive()) return;
      state.busy = true;
      refreshSummary();
      try {
        const payload = await api(
          "/api/retry",
          { method: "POST", body: requestBody() }
        );
        state.document = payload.document;
        state.dirty = false;
        state.retryJob = payload.job;
        state.watchedRetryJobId = payload.job.job_id;
        render();
        toast("오류 문장 재번역을 시작했습니다.");
        scheduleRetryPoll();
      } catch (error) {
        toast(error.message, true);
      } finally {
        state.busy = false;
        refreshSummary();
      }
    }

    $("#save-button").addEventListener("click", () => runAction("save"));
    $("#qa-button").addEventListener("click", () => runAction("qa"));
    $("#retry-button").addEventListener("click", startRetry);
    $("#qa-override-button").addEventListener("click", () => {
      const count = state.document.summary.overridable_errors;
      $("#qaOverrideSummary").textContent =
        `QA 오류 ${count}개가 남아 있습니다. ` +
        "각 오류를 확인했다면 승인 사유를 남기고 최종 승인할 수 있습니다.";
      $("#qaOverrideReason").value = "";
      $("#qaOverrideDialog").showModal();
      $("#qaOverrideReason").focus();
    });
    $("#cancelQaOverride").addEventListener("click", () => {
      $("#qaOverrideDialog").close();
    });
    $("#confirmQaOverride").addEventListener("click", () => {
      const reason = $("#qaOverrideReason").value.trim();
      if (!reason) {
        toast("QA 오류를 예외 승인한 사유를 입력하세요.", true);
        $("#qaOverrideReason").focus();
        return;
      }
      $("#qaOverrideDialog").close();
      runAction("finalize", { qa_override_reason: reason });
    });
    $("#finalize-button").addEventListener("click", () => runAction("finalize"));
    $("#stayAfterFinalize").addEventListener("click", () => {
      $("#translationCompleteDialog").close();
    });
    $("#returnDashboard").classList.toggle("hidden", !RETURN_URL);
    $("#returnDashboard").addEventListener("click", () => {
      if (RETURN_URL) window.location.assign(RETURN_URL);
    });
    $("#search").addEventListener("input", (event) => {
      state.search = event.target.value;
      render();
    });
    $("#filters").addEventListener("click", (event) => {
      const button = event.target.closest("[data-filter]");
      if (!button) return;
      state.filter = button.dataset.filter;
      document.querySelectorAll(".filter").forEach((node) => {
        node.classList.toggle("active", node === button);
      });
      render();
    });
    $("#termbase-button").addEventListener("click", openTermbase);
    $("#termbaseDialogClose").addEventListener("click", () => {
      $("#termbaseDialog").close();
    });
    $("#termbase-search").addEventListener("input", (event) => {
      state.termSearch = event.target.value;
      renderTermbase();
    });
    $("#termbase-filters").addEventListener("click", (event) => {
      const button = event.target.closest("[data-term-filter]");
      if (!button) return;
      state.termFilter = button.dataset.termFilter;
      document.querySelectorAll("[data-term-filter]").forEach((node) => {
        node.classList.toggle("active", node === button);
      });
      renderTermbase();
    });
    window.addEventListener("keydown", (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLocaleLowerCase() === "s") {
        event.preventDefault();
        runAction("save");
      }
    });
    window.addEventListener("beforeunload", (event) => {
      if (state.dirty) event.preventDefault();
    });

    Promise.all([api("/api/review"), api("/api/retry-job")])
      .then(([document, retryPayload]) => {
        state.document = document;
        state.retryJob = retryPayload.job;
        if (retryJobActive()) {
          state.watchedRetryJobId = state.retryJob.job_id;
        }
        render();
        scheduleRetryPoll();
      })
      .catch((error) => {
        $("#content").replaceChildren(make("div", "empty", error.message));
        toast(error.message, true);
      });
  </script>
</body>
</html>
