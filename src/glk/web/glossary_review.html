<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GLK 용어 검수</title>
  <link rel="stylesheet" href="/assets/tokens.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font: 14px/1.5 Inter, Pretendard, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .header {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 18px;
      min-height: 72px;
      padding: 11px 22px;
      color: var(--ink);
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 96%, transparent);
      box-shadow: none;
    }
    .brand { min-width: 230px; }
    .eyebrow {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .17em;
      text-transform: uppercase;
    }
    h1 { margin: 1px 0 0; font-size: 19px; line-height: 1.2; }
    .metrics { display: flex; flex: 1; gap: 7px; overflow-x: auto; }
    .metric {
      min-width: 69px;
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 0;
      border-width: 0 1px 0 0;
      border-color: var(--line);
      background: transparent;
    }
    .metric strong { display: block; font-size: 15px; }
    .metric span { color: var(--muted); font-size: 10px; white-space: nowrap; }
    .actions { display: flex; gap: 7px; }
    .button {
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .button:disabled { cursor: not-allowed; opacity: .45; }
    .button-secondary {
      color: var(--ink);
      border-color: var(--line);
      background: var(--surface);
    }
    .button-primary,
    .button-success { color: var(--on-solid); border-color: var(--ink); background: var(--ink); }
    .button-primary:hover,
    .button-success:hover { background: var(--ink-soft); }
    main { padding: 20px 22px 72px; }
    .intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin: 0 0 14px;
    }
    .intro h2 { margin: 0 0 3px; font-size: 23px; }
    .intro p { margin: 0; color: var(--muted); }
    .file-state {
      padding: 6px 10px;
      color: var(--ink-soft);
      border-radius: 999px;
      background: var(--soft);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .toolbar {
      position: sticky;
      top: 72px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: stretch;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: color-mix(in srgb, var(--surface) 96%, transparent);
      box-shadow: none;
      backdrop-filter: none;
    }
    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      width: 100%;
    }
    .control {
      height: 36px;
      min-height: 36px;
      padding: 0 9px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      background: var(--surface);
    }
    .control:focus { border-color: var(--line-strong); box-shadow: none; }
    .search {
      flex: 1 1 220px;
      width: auto;
      min-width: 160px;
      max-width: 310px;
      -webkit-appearance: none;
      appearance: none;
    }
    .search-separator {
      flex: 0 0 16px;
      width: 16px;
      height: 1px;
    }
    .selection-count { color: var(--muted); font-size: 12px; }
    .button-table {
      height: 36px;
      min-height: 36px;
      padding: 7px 10px;
      color: var(--navy);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      font-weight: 700;
    }
    .button-table:hover { border-color: var(--line-strong); background: var(--surface-hover); }
    .table-shell {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: none;
      overflow: auto;
    }
    table {
      width: 100%;
      min-width: 1220px;
      border-collapse: separate;
      border-spacing: 0;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 10px 8px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      background: var(--soft);
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
      white-space: nowrap;
    }
    td {
      padding: 8px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      background: var(--surface);
    }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: var(--surface-hover); }
    tbody tr.status-review td:first-child { box-shadow: inset 4px 0 var(--review); }
    tbody tr.status-approved td:first-child { box-shadow: inset 4px 0 var(--success); }
    tbody tr.status-keep td:first-child { box-shadow: inset 4px 0 var(--keep); }
    tbody tr.status-rejected td:first-child { box-shadow: inset 4px 0 var(--rejected); }
    tbody tr.invalid td { background: var(--error-bg); }
    .cell-input, .cell-select {
      width: 100%;
      padding: 7px 8px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 6px;
      outline: none;
      background: var(--surface);
    }
    .cell-input:focus, .cell-select:focus {
      border-color: var(--line-strong);
      box-shadow: none;
    }
    .cell-input:disabled {
      color: var(--muted);
      border-color: transparent;
      background: transparent;
    }
    .source {
      min-width: 180px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }
    .source .manual-label {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 6px;
      color: var(--ink-soft);
      border-radius: 999px;
      background: var(--soft);
      font-size: 10px;
    }
    .translation { min-width: 190px; }
    .status { min-width: 125px; }
    .category { min-width: 130px; }
    .evidence { min-width: 230px; max-width: 360px; }
    .meta {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }
    details { margin-top: 5px; color: var(--muted); font-size: 12px; }
    summary { cursor: pointer; color: var(--ink-soft); font-weight: 700; }
    .example {
      max-height: 130px;
      margin: 6px 0 0;
      padding: 7px;
      border-radius: 6px;
      background: var(--soft);
      white-space: pre-wrap;
      overflow: auto;
    }
    .delete-button {
      padding: 5px 7px;
      color: var(--error);
      border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
      border-radius: 6px;
      background: var(--surface);
      font-size: 11px;
    }
    .empty {
      padding: 58px 20px;
      color: var(--muted);
      text-align: center;
    }
    .option-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 12px;
      padding: 10px 12px;
      color: var(--accent-dark);
      border: 1px solid rgb(216 92 65 / 28%);
      border-radius: 8px;
      background: var(--error-bg);
      font-size: 13px;
    }
    .option-line input { flex: 0 0 auto; }
    .option-line strong { display: block; }
    .option-line small { display: block; color: var(--muted); }
    dialog {
      width: min(480px, calc(100vw - 32px));
      padding: 24px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow-dialog);
    }
    dialog::backdrop { background: var(--overlay); }
    dialog h2 { margin: 0 0 10px; font-size: 21px; }
    dialog p { margin: 0; color: var(--muted); }
    dialog .button-secondary {
      color: var(--ink);
      border-color: var(--line);
      background: var(--surface);
    }
    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 22px;
    }
    .hidden { display: none !important; }
    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 50;
      max-width: 480px;
      padding: 12px 15px;
      color: var(--on-solid);
      border-radius: 8px;
      background: var(--ink);
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      white-space: pre-line;
      transition: .2s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { background: var(--error); }
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    summary:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    .control:focus-visible,
    .cell-input:focus-visible,
    .cell-select:focus-visible {
      border-color: var(--focus);
    }
    @media (max-width: 960px) {
      .header { flex-wrap: wrap; }
      .brand { min-width: 0; flex: 1; }
      .metrics { order: 3; width: 100%; }
      .actions { width: 100%; }
      .actions .button { flex: 1; }
      main { padding: 16px 10px 60px; }
      .toolbar { top: 124px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="eyebrow">Game Localization Kit</div>
      <h1 id="project-name">용어 검수</h1>
    </div>
    <div class="metrics" id="metrics"></div>
    <div class="actions">
      <button class="button button-secondary" id="save-button">TSV 저장</button>
      <button class="button button-success" id="import-button">검증 및 termbase 생성</button>
    </div>
  </header>
  <main>
    <div class="intro">
      <div>
        <h2>용어 후보를 표처럼 검수하세요</h2>
        <p>상태·번역어·분류를 수정하면 기존 glossary_review.tsv에 그대로 저장됩니다.</p>
      </div>
      <span class="file-state" id="file-state">불러오는 중</span>
    </div>
    <label class="option-line">
      <input id="allow-missing" type="checkbox">
      <span>
        <strong>승인 원문에 없는 수동 용어 허용</strong>
        <small>확장판 용어처럼 원문에서 찾을 수 없는 용어를 의도적으로 등록할 때만 선택하세요.</small>
      </span>
    </label>
    <section class="toolbar">
      <div class="toolbar-row search-row">
        <select class="control" id="status-filter" aria-label="상태 필터">
          <option value="all">모든 상태</option>
        </select>
        <select class="control" id="category-filter" aria-label="분류 필터">
          <option value="all">모든 분류</option>
        </select>
        <select class="control" id="sort-order" aria-label="정렬 기준">
          <option value="default">추천 순서</option>
          <option value="context">첫 등장 위치 순</option>
          <option value="occurrences-desc">출현 많은 순</option>
          <option value="occurrences-asc">출현 적은 순</option>
          <option value="source">원문 용어 순</option>
          <option value="status">상태 순</option>
        </select>
        <span class="search-separator" aria-hidden="true"></span>
        <select class="control" id="search-field" aria-label="검색 범위">
          <option value="source">원문 용어</option>
          <option value="translation">번역어</option>
          <option value="context">출현 문맥</option>
          <option value="all">전체 항목</option>
        </select>
        <input class="control search" id="search" type="search"
          aria-label="검색어" placeholder="원문 용어 검색">
      </div>
      <div class="toolbar-row bulk-row">
        <span class="selection-count" id="selection-count">0개 선택</span>
        <select class="control" id="bulk-status" aria-label="일괄 상태">
          <option value="">상태 일괄 변경</option>
        </select>
        <button class="button-table" id="bulk-apply" type="button">적용</button>
        <button class="button-table" id="add-button" type="button">+ 수동 용어</button>
      </div>
    </section>
    <section class="table-shell">
      <table>
        <thead>
          <tr>
            <th><input id="select-visible" type="checkbox" aria-label="표시된 행 모두 선택"></th>
            <th>상태</th>
            <th>원문 용어</th>
            <th>번역어</th>
            <th>분류</th>
            <th>출현·문맥</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td class="empty" colspan="7">검수 데이터를 불러오는 중입니다…</td></tr>
        </tbody>
      </table>
    </section>
  </main>
  <dialog id="termbaseCompleteDialog" aria-labelledby="termbaseCompleteTitle">
    <h2 id="termbaseCompleteTitle">용어집 생성이 완료되었습니다</h2>
    <p>
      다음 단계에서 승인된 용어집을 기반으로 초벌 번역을 시작할 수 있습니다.
    </p>
    <div class="dialog-actions">
      <button class="button button-secondary" id="stayAfterImport" type="button">
        이 화면에 머물기
      </button>
      <button class="button button-primary" id="returnDashboard" type="button">
        대시보드로 돌아가기
      </button>
    </div>
  </dialog>
  <div class="toast" id="toast"></div>
  <script>
    "use strict";
    const AUTH_TOKEN = __GLK_TOKEN_JSON__;
    const RETURN_URL = __GLK_RETURN_URL_JSON__;
    const STATUS_LABELS = {
      review: "검토 필요",
      approved: "승인",
      keep: "원문 유지",
      rejected: "제외"
    };
    const CATEGORY_LABELS = {
      term: "일반 용어",
      proper_noun: "고유명사",
      ability: "능력명",
      component: "구성품",
      ui: "UI",
      phrase: "문구"
    };
    const SEARCH_PLACEHOLDERS = {
      source: "원문 용어 검색",
      translation: "번역어 검색",
      context: "출현 문맥 검색",
      all: "전체 항목 검색"
    };
    const state = {
      document: null,
      dirty: false,
      busy: false,
      search: "",
      searchField: "source",
      statusFilter: "all",
      categoryFilter: "all",
      sortOrder: "default",
      selected: new Set(),
      manualSequence: 0
    };
    const $ = (selector) => document.querySelector(selector);

    async function api(path, options = {}) {
      const headers = Object.assign(
        { "X-GLK-Token": AUTH_TOKEN },
        options.body ? { "Content-Type": "application/json" } : {},
        options.headers || {}
      );
      const response = await fetch(path, Object.assign({}, options, { headers }));
      const payload = await response.json().catch(() => ({ message: "응답을 읽을 수 없습니다." }));
      if (!response.ok) throw new Error(payload.message || `HTTP ${response.status}`);
      return payload;
    }

    function make(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function toast(message, error = false) {
      const node = $("#toast");
      node.textContent = message;
      node.className = `toast show${error ? " error" : ""}`;
      clearTimeout(toast.timer);
      toast.timer = setTimeout(
        () => { node.className = "toast"; },
        error ? 9000 : 3400
      );
    }

    function importFailureMessage(payload) {
      const lines = [
        `TSV는 저장했지만 termbase를 만들지 못했습니다: ${payload.message}`
      ];
      if (payload.detail) lines.push(`실패 항목: ${payload.detail}`);
      lines.push(
        "표시된 행의 상태·번역어·중복 여부를 확인하세요. " +
        "원문에 없는 수동 용어라면 화면 상단의 허용 항목을 선택한 뒤 다시 시도하세요."
      );
      return lines.join("\n");
    }

    function option(value, label, selected = false) {
      const node = make("option", "", label);
      node.value = value;
      node.selected = selected;
      return node;
    }

    function metric(value, label) {
      const node = make("div", "metric");
      node.append(make("strong", "", String(value)), make("span", "", label));
      return node;
    }

    function termbaseStatusLabel(status) {
      return {
        current: "최신 상태",
        not_built: "미생성",
        stale: "업데이트 필요",
        not_ready: "준비 전",
      }[status] || "상태 확인 필요";
    }

    function summary() {
      const result = {
        rows: state.document.rows.length,
        review: 0,
        approved: 0,
        keep: 0,
        rejected: 0,
        missing: 0
      };
      state.document.rows.forEach((row) => {
        if (Object.hasOwn(result, row.status)) result[row.status] += 1;
        if (row.status === "approved" && !row.translation.trim()) result.missing += 1;
      });
      return result;
    }

    function refreshSummary() {
      const value = summary();
      $("#metrics").replaceChildren(
        metric(value.rows, "전체"),
        metric(value.review, "검토 필요"),
        metric(value.approved, "승인"),
        metric(value.keep, "원문 유지"),
        metric(value.rejected, "제외")
      );
      $("#file-state").textContent =
        `${termbaseStatusLabel(state.document.termbase_status)}` +
        (state.dirty ? " · 저장 안 됨" : "");
      $("#selection-count").textContent = `${state.selected.size}개 선택`;
      $("#save-button").disabled = state.busy || !state.dirty;
      $("#import-button").disabled = state.busy;
    }

    function rowSearchText(row) {
      const fields = {
        source: [row.source_term, row.variants],
        translation: [row.translation],
        context: [row.locations, row.example],
        all: [
          row.source_term,
          row.translation,
          row.category,
          row.variants,
          row.locations,
          row.example
        ]
      };
      return (fields[state.searchField] || fields.source)
        .join("\n")
        .toLocaleLowerCase();
    }

    function visible(row) {
      if (state.statusFilter !== "all" && row.status !== state.statusFilter) return false;
      if (state.categoryFilter !== "all" && row.category !== state.categoryFilter) return false;
      const query = state.search.trim().toLocaleLowerCase();
      return !query || rowSearchText(row).includes(query);
    }

    const textCollator = new Intl.Collator(["ko", "en"], {
      numeric: true,
      sensitivity: "base"
    });

    function compareText(left, right) {
      return textCollator.compare(String(left || ""), String(right || ""));
    }

    function firstLocation(row) {
      return String(row.locations || "").split(",")[0].trim();
    }

    function compareOptionalText(left, right) {
      if (!left && !right) return 0;
      if (!left) return 1;
      if (!right) return -1;
      return compareText(left, right);
    }

    function occurrenceCount(row) {
      const value = Number(row.occurrences);
      return Number.isFinite(value) && value >= 0 ? value : null;
    }

    function compareOptionalNumber(left, right, direction) {
      if (left === null && right === null) return 0;
      if (left === null) return 1;
      if (right === null) return -1;
      return (left - right) * direction;
    }

    function compareRows(left, right) {
      let compared = 0;
      if (state.sortOrder === "context") {
        compared = compareOptionalText(
          firstLocation(left.row),
          firstLocation(right.row)
        );
      } else if (state.sortOrder === "occurrences-desc") {
        compared = compareOptionalNumber(
          occurrenceCount(left.row),
          occurrenceCount(right.row),
          -1
        );
      } else if (state.sortOrder === "occurrences-asc") {
        compared = compareOptionalNumber(
          occurrenceCount(left.row),
          occurrenceCount(right.row),
          1
        );
      } else if (state.sortOrder === "source") {
        compared = compareText(left.row.source_term, right.row.source_term);
      } else if (state.sortOrder === "status") {
        compared = (
          state.document.statuses.indexOf(left.row.status)
          - state.document.statuses.indexOf(right.row.status)
        );
      }
      if (compared) return compared;
      return left.index - right.index;
    }

    function visibleRows() {
      return state.document.rows
        .map((row, index) => ({ row, index }))
        .filter((item) => visible(item.row))
        .sort(compareRows)
        .map((item) => item.row);
    }

    function markDirty() {
      state.dirty = true;
      refreshSummary();
    }

    function applyStatusRule(row) {
      if (row.status === "keep") row.translation = row.source_term;
      if (row.status === "rejected") row.translation = "";
    }

    function buildSelect(values, labels, current, className) {
      const select = make("select", className);
      values.forEach((value) => {
        select.append(option(value, labels[value] || value, value === current));
      });
      return select;
    }

    function renderRows() {
      const tbody = $("#rows");
      tbody.replaceChildren();
      const shown = visibleRows();
      if (!shown.length) {
        const row = make("tr");
        const cell = make("td", "empty", "조건에 맞는 용어가 없습니다.");
        cell.colSpan = 7;
        row.append(cell);
        tbody.append(row);
        $("#select-visible").checked = false;
        refreshSummary();
        return;
      }

      shown.forEach((item) => {
        const row = make("tr", `status-${item.status}`);
        row.dataset.rowKey = item.row_key;
        if (item.status === "approved" && !item.translation.trim()) row.classList.add("invalid");

        const checkCell = make("td");
        const checkbox = make("input");
        checkbox.type = "checkbox";
        checkbox.checked = state.selected.has(item.row_key);
        checkbox.setAttribute("aria-label", `${item.source_term || "수동 용어"} 선택`);
        checkbox.addEventListener("change", () => {
          if (checkbox.checked) state.selected.add(item.row_key);
          else state.selected.delete(item.row_key);
          refreshSummary();
        });
        checkCell.append(checkbox);

        const statusCell = make("td", "status");
        const status = buildSelect(
          state.document.statuses, STATUS_LABELS, item.status, "cell-select"
        );
        status.addEventListener("change", () => {
          item.status = status.value;
          applyStatusRule(item);
          markDirty();
          renderRows();
        });
        statusCell.append(status);

        const sourceCell = make("td", "source");
        if (item.manual) {
          const input = make("input", "cell-input");
          input.value = item.source_term;
          input.placeholder = "추가할 원문 용어";
          input.addEventListener("input", () => {
            item.source_term = input.value;
            if (item.status === "keep") item.translation = item.source_term;
            markDirty();
          });
          sourceCell.append(input, make("span", "manual-label", "수동 추가"));
        } else {
          sourceCell.append(document.createTextNode(item.source_term));
        }

        const translationCell = make("td", "translation");
        const translation = make("input", "cell-input");
        translation.value = item.translation;
        translation.placeholder =
          item.status === "approved" ? "번역어 필수" : "번역어";
        translation.disabled = item.status === "keep" || item.status === "rejected";
        translation.addEventListener("input", () => {
          item.translation = translation.value;
          row.classList.toggle(
            "invalid",
            item.status === "approved" && !item.translation.trim()
          );
          markDirty();
        });
        translationCell.append(translation);

        const categoryCell = make("td", "category");
        const category = buildSelect(
          state.document.categories, CATEGORY_LABELS, item.category, "cell-select"
        );
        category.addEventListener("change", () => {
          item.category = category.value;
          markDirty();
        });
        categoryCell.append(category);

        const evidenceCell = make("td", "evidence");
        const count = item.occurrences || (item.manual ? "저장 후 확인" : "0");
        const location = item.locations ? ` · ${item.locations}` : "";
        evidenceCell.append(make("div", "meta", `${count}회${location}`));
        if (item.example || item.variants) {
          const details = make("details");
          const summaryNode = make("summary", "", "실제 문맥 펼치기");
          const example = make(
            "pre",
            "example",
            [item.variants ? `표기: ${item.variants}` : "", item.example]
              .filter(Boolean).join("\n\n")
          );
          details.append(summaryNode, example);
          evidenceCell.append(details);
        }

        const actionCell = make("td");
        if (item.manual) {
          const remove = make("button", "delete-button", "삭제");
          remove.type = "button";
          remove.addEventListener("click", () => {
            state.document.rows = state.document.rows.filter(
              (candidate) => candidate.row_key !== item.row_key
            );
            state.selected.delete(item.row_key);
            markDirty();
            renderRows();
          });
          actionCell.append(remove);
        }

        row.append(
          checkCell,
          statusCell,
          sourceCell,
          translationCell,
          categoryCell,
          evidenceCell,
          actionCell
        );
        tbody.append(row);
      });
      const visibleKeys = shown.map((row) => row.row_key);
      $("#select-visible").checked =
        visibleKeys.length > 0 && visibleKeys.every((key) => state.selected.has(key));
      refreshSummary();
    }

    function initializeControls() {
      const statusFilter = $("#status-filter");
      const bulkStatus = $("#bulk-status");
      state.document.statuses.forEach((value) => {
        statusFilter.append(option(value, STATUS_LABELS[value]));
        bulkStatus.append(option(value, STATUS_LABELS[value]));
      });
      const categoryFilter = $("#category-filter");
      state.document.categories.forEach((value) => {
        categoryFilter.append(option(value, CATEGORY_LABELS[value] || value));
      });
    }

    function render() {
      document.title = `${state.document.project.name} · GLK Glossary`;
      $("#project-name").textContent = state.document.project.name;
      renderRows();
    }

    function requestBody() {
      return JSON.stringify({
        review_sha256: state.document.review_sha256,
        allow_missing_terms: $("#allow-missing").checked,
        rows: state.document.rows.map((row) => ({
          candidate_id: row.candidate_id,
          status: row.status,
          source_term: row.source_term,
          translation: row.translation,
          category: row.category,
          note: row.note
        }))
      });
    }

    async function runAction(action) {
      if (state.busy) return;
      state.busy = true;
      refreshSummary();
      try {
        const payload = await api(`/api/${action}`, {
          method: "POST",
          body: requestBody()
        });
        state.document = payload.document;
        state.selected.clear();
        state.dirty = false;
        render();
        if (action === "save") {
          toast("glossary_review.tsv에 저장했습니다.");
        } else if (payload.ok) {
          toast(
            `termbase를 생성했습니다. 활성 용어 ${payload.result.active_count}개, 제외 ${payload.result.rejected_count}개.`
          );
          $("#termbaseCompleteDialog").showModal();
        } else {
          toast(importFailureMessage(payload), true);
        }
      } catch (error) {
        toast(error.message, true);
      } finally {
        state.busy = false;
        refreshSummary();
      }
    }

    $("#save-button").addEventListener("click", () => runAction("save"));
    $("#import-button").addEventListener("click", () => runAction("import"));
    $("#stayAfterImport").addEventListener("click", () => {
      $("#termbaseCompleteDialog").close();
    });
    $("#returnDashboard").classList.toggle("hidden", !RETURN_URL);
    $("#returnDashboard").addEventListener("click", () => {
      if (RETURN_URL) window.location.assign(RETURN_URL);
    });
    $("#search").addEventListener("input", (event) => {
      state.search = event.target.value;
      renderRows();
    });
    $("#search-field").addEventListener("change", (event) => {
      state.searchField = event.target.value;
      $("#search").placeholder =
        SEARCH_PLACEHOLDERS[state.searchField] || SEARCH_PLACEHOLDERS.source;
      renderRows();
    });
    $("#status-filter").addEventListener("change", (event) => {
      state.statusFilter = event.target.value;
      renderRows();
    });
    $("#category-filter").addEventListener("change", (event) => {
      state.categoryFilter = event.target.value;
      renderRows();
    });
    $("#sort-order").addEventListener("change", (event) => {
      state.sortOrder = event.target.value;
      renderRows();
    });
    $("#select-visible").addEventListener("change", (event) => {
      visibleRows().forEach((row) => {
        if (event.target.checked) state.selected.add(row.row_key);
        else state.selected.delete(row.row_key);
      });
      renderRows();
    });
    $("#bulk-apply").addEventListener("click", () => {
      const status = $("#bulk-status").value;
      if (!status) {
        toast("일괄 적용할 상태를 선택하세요.", true);
        return;
      }
      let changed = 0;
      state.document.rows.forEach((row) => {
        if (!state.selected.has(row.row_key)) return;
        row.status = status;
        applyStatusRule(row);
        changed += 1;
      });
      if (!changed) {
        toast("먼저 변경할 행을 선택하세요.", true);
        return;
      }
      markDirty();
      renderRows();
      toast(`${changed}개 용어를 '${STATUS_LABELS[status]}' 상태로 변경했습니다.`);
    });
    $("#add-button").addEventListener("click", () => {
      const rowKey = `manual-browser-${Date.now()}-${state.manualSequence++}`;
      state.document.rows.unshift({
        row_key: rowKey,
        candidate_id: "",
        manual: true,
        status: "review",
        source_term: "",
        translation: "",
        category: "term",
        note: "",
        variants: "",
        occurrences: "",
        locations: "",
        example: ""
      });
      state.statusFilter = "all";
      state.categoryFilter = "all";
      $("#status-filter").value = "all";
      $("#category-filter").value = "all";
      markDirty();
      renderRows();
      document.querySelector(`[data-row-key="${rowKey}"] .source input`)?.focus();
    });
    window.addEventListener("keydown", (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLocaleLowerCase() === "s") {
        event.preventDefault();
        runAction("save");
      }
    });
    window.addEventListener("beforeunload", (event) => {
      if (state.dirty) event.preventDefault();
    });

    api("/api/review")
      .then((documentValue) => {
        state.document = documentValue;
        state.document.rows.forEach((row) => {
          if (row.status === "keep" && !row.translation) {
            row.translation = row.source_term;
          }
        });
        initializeControls();
        render();
      })
      .catch((error) => {
        $("#rows").innerHTML = "";
        const row = make("tr");
        const cell = make("td", "empty", error.message);
        cell.colSpan = 7;
        row.append(cell);
        $("#rows").append(row);
        toast(error.message, true);
      });
  </script>
</body>
</html>
