<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GLK 원문 검수</title>
  <link rel="stylesheet" href="/assets/tokens.css">
  <style>
    :root {
      --accent: var(--ink-soft);
      --accent-soft: var(--soft);
      --block-number: #e85d35;
    }
    @media (prefers-color-scheme: dark) {
      :root { --block-number: #ff8a65; }
    }
    * { box-sizing: border-box; }
    body {
      height: 100vh; margin: 0; overflow: hidden; display: flex; flex-direction: column;
      background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif;
    }
    button, textarea, input { font: inherit; }
    button {
      border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
      color: var(--text); padding: 8px 11px; cursor: pointer;
    }
    button:hover { border-color: var(--line-strong); background: var(--panel2); }
    button:disabled { cursor: not-allowed; opacity: .5; }
    button.primary {
      color: var(--on-solid); border-color: var(--text); background: var(--text); font-weight: 700;
    }
    button.primary:hover { border-color: var(--accent); background: var(--accent); }
    button.danger { color: var(--danger); }
    header {
      flex: none; border-bottom: 1px solid var(--line); background: var(--surface);
      position: relative; z-index: 20;
    }
    .header-main, .header-workflow { display: flex; align-items: center; gap: 12px; padding: 0 16px; }
    .header-main { min-height: 58px; }
    .header-workflow {
      min-height: 47px; justify-content: flex-end; border-top: 1px solid var(--line);
      background: var(--panel2);
    }
    header h1 { font-size: 18px; margin: 0; }
    .grow { flex: 1; }
    .status { color: var(--muted); white-space: nowrap; }
    .layout {
      flex: 1; min-height: 0; display: grid;
      grid-template-columns: 210px minmax(400px, 1fr) minmax(420px, 0.9fr);
    }
    aside, main, section.editor { min-height: 0; overflow: auto; }
    aside {
      border-right: 1px solid var(--line); padding: 12px; background: var(--panel2);
      display: flex; flex-direction: column; overflow: hidden;
    }
    #groups { min-height: 0; overflow: auto; }
    .unresolved-panel {
      flex: none; margin-bottom: 12px; padding: 11px; border: 1px solid rgb(216 92 65 / 28%);
      border-radius: 8px; background: var(--danger-soft);
    }
    .unresolved-panel.complete { border-color: color-mix(in srgb, var(--success) 35%, var(--line)); background: var(--success-soft); }
    .unresolved-head {
      display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
      margin-bottom: 8px;
    }
    .unresolved-head h2 { margin: 0; font-size: 13px; font-weight: 600; }
    .unresolved-total { color: var(--warn); font-size: 20px; line-height: 1; }
    .unresolved-panel.complete .unresolved-total { color: var(--success); }
    .unresolved-counts {
      display: grid; grid-template-columns: 1fr auto; gap: 4px 8px;
      color: var(--muted); font-size: 12px;
    }
    .unresolved-counts strong { color: var(--text); font-weight: 600; }
    .unresolved-panel .filter-button { margin: 10px 0 0; }
    .unresolved-panel .override-button {
      width: 100%; margin-top: 7px; border-color: rgb(216 92 65 / 28%); color: var(--danger);
      background: var(--danger-soft);
    }
    .unresolved-panel .override-button:hover { border-color: var(--warn); }
    .group {
      width: 100%; text-align: left; margin-bottom: 7px; display: flex; justify-content: space-between;
    }
    .group span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .group-meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .group-meta.warning { color: var(--warn); }
    .group.active { color: var(--text); border-color: var(--text); background: var(--accent-soft); }
    .filter-button { width: 100%; margin-bottom: 12px; }
    .filter-button.active { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }
    main { padding: 14px; border-right: 1px solid var(--line); }
    .viewer-tools { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    .viewer-tools-spacer { flex: 1; }
    .canvas { position: relative; margin: auto; width: 100%; max-width: none; user-select: none; }
    .canvas img { display: block; width: 100%; max-width: none; height: auto; border-radius: 4px; }
    .overlay { position: absolute; inset: 0; cursor: crosshair; }
    .box {
      position: absolute; border: 2px solid rgb(50 56 63 / 72%); background: rgb(50 56 63 / 10%);
      cursor: pointer; min-width: 3px; min-height: 3px;
    }
    .box-number {
      position: absolute; top: 50%; right: calc(100% + 4px); transform: translateY(-50%);
      color: var(--block-number); font-size: 14px; font-weight: 800; line-height: 1;
      pointer-events: none;
    }
    .box.selected { border-color: var(--text); background: rgb(50 56 63 / 18%); z-index: 3; }
    .box.bulk-selected {
      border-color: var(--text); background: color-mix(in srgb, var(--text) 22%, transparent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--text) 38%, transparent); z-index: 4;
    }
    .box.icon-selected {
      border-color: var(--focus); background: color-mix(in srgb, var(--focus) 18%, transparent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--focus) 34%, transparent); z-index: 4;
    }
    .box.excluded { border-color: #7d8794; background: rgba(90,98,110,.16); opacity: .55; }
    .box.warning { box-shadow: 0 0 0 2px var(--warn); }
    .box.issue { box-shadow: 0 0 0 2px var(--danger); }
    .box.warning.issue { box-shadow: 0 0 0 2px var(--danger), 0 0 0 4px var(--warn); }
    .overlay.drawing .box { pointer-events: none; }
    .draw-box { position: absolute; border: 2px dashed var(--text); background: rgb(50 56 63 / 14%); pointer-events: none; }
    #addMissing.active { border-color: var(--text); color: var(--text); background: var(--accent-soft); }
    section.editor { padding: 14px; background: var(--panel); }
    .summary { color: var(--muted); margin-bottom: 10px; }
    .card {
      position: relative; border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 10px;
      background: var(--surface);
    }
    .card.selected { border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
    .card.bulk-selected {
      border-color: var(--text); box-shadow: 0 0 0 2px var(--text);
      background: color-mix(in srgb, var(--text) 5%, var(--surface));
    }
    .card.bulk-select-mode textarea { cursor: pointer; caret-color: transparent; }
    .card.icon-selected { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
    .card.excluded { opacity: .6; }
    .card.dragging { opacity: .42; }
    .card.drop-before::before, .card.drop-after::after {
      content: ""; position: absolute; left: 0; right: 0; height: 3px;
      border-radius: 999px; background: var(--text); z-index: 5;
    }
    .card.drop-before::before { top: -7px; }
    .card.drop-after::after { bottom: -7px; }
    .card-head { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
    .card-number { color: var(--text); font-size: 12px; font-weight: 700; white-space: nowrap; }
    .tag { border-radius: 999px; padding: 2px 7px; font-size: 11px; background: var(--panel2); white-space: nowrap; }
    .tag.manual { color: var(--muted); }
    .tag.warning { color: var(--warn); }
    .tag.issue { color: var(--danger); }
    .source-warning {
      margin-top: 8px; padding: 8px 10px; border: 1px solid rgb(216 92 65 / 28%);
      border-radius: 6px; color: var(--danger); background: var(--danger-soft);
      white-space: pre-wrap;
    }
    textarea {
      width: 100%; min-height: 100px; resize: vertical; border: 1px solid var(--line);
      background: var(--surface); color: var(--text); border-radius: 6px; padding: 9px;
    }
    textarea:focus { outline: none; border-color: var(--line-strong); }
    .mini { padding: 4px 7px; font-size: 12px; }
    .drag-handle {
      display: inline-flex; align-items: center; justify-content: center; width: 25px; height: 25px;
      border: 1px solid transparent; border-radius: 5px; color: var(--muted); cursor: grab;
      font-size: 17px; line-height: 1; user-select: none;
    }
    .drag-handle:hover { border-color: var(--line); color: var(--text); background: var(--panel2); }
    .drag-handle:active { cursor: grabbing; }
    .icon-audit-select { color: var(--text); font-size: 12px; font-weight: 600; }
    .review-mode-switch {
      display: inline-flex; padding: 3px; border: 1px solid var(--line);
      border-radius: 8px; background: var(--panel2);
    }
    .review-mode-switch button {
      padding: 5px 9px; border: 0; background: transparent; color: var(--muted);
    }
    .review-mode-switch button:hover { background: var(--surface-hover); }
    .review-mode-switch button.active {
      color: var(--text); background: var(--surface); box-shadow: var(--shadow); font-weight: 600;
    }
    .bulk-actions {
      position: fixed; left: 50%; bottom: 18px; z-index: 25; transform: translateX(-50%);
      display: flex; align-items: center; gap: 8px; min-width: min(480px, calc(100vw - 32px));
      padding: 9px 10px 9px 14px; border: 1px solid var(--line-strong); border-radius: 8px;
      background: var(--surface-raised); box-shadow: var(--shadow-dialog);
    }
    .bulk-actions strong { margin-right: auto; font-size: 13px; white-space: nowrap; }
    .bulk-actions button { padding: 7px 10px; }
    .bulk-actions .bulk-exclude { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 42%, var(--line)); }
    .bulk-actions .bulk-exclude:hover { background: var(--danger-soft); border-color: var(--danger); }
    .notice {
      position: fixed; right: 18px; bottom: 18px; max-width: 460px; padding: 12px 15px;
      border-radius: 8px; color: var(--toast-text); background: var(--toast-bg); border: 1px solid var(--toast-border); z-index: 30;
    }
    .notice.error { border-color: var(--toast-error-border); color: var(--toast-error-text); background: var(--toast-error-bg); }
    dialog {
      width: min(460px, calc(100vw - 32px)); border: 1px solid var(--line);
      border-radius: 8px; background: var(--surface); color: var(--text);
      padding: 24px; box-shadow: var(--shadow-dialog);
    }
    dialog::backdrop { background: var(--overlay); }
    dialog h2 { margin: 0 0 10px; font-size: 21px; }
    dialog p { margin: 0; color: var(--muted); }
    .dialog-actions {
      display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px;
      flex-wrap: wrap;
    }
    dialog.icon-audit-dialog { width: min(960px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
    .icon-audit-results { display: grid; gap: 14px; margin-top: 18px; }
    .icon-audit-result {
      display: grid; grid-template-columns: minmax(220px, .75fr) minmax(0, 1.25fr);
      gap: 14px; padding: 14px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--panel2);
    }
    .icon-audit-result.applied { border-color: color-mix(in srgb, var(--success) 45%, var(--line)); }
    .icon-audit-crop { min-width: 0; }
    .icon-audit-crop img {
      display: block; width: 100%; max-height: 260px; object-fit: contain;
      border: 1px solid var(--line); border-radius: 6px; background: white;
    }
    .icon-audit-detail { min-width: 0; }
    .icon-audit-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .icon-audit-head strong { font-size: 13px; }
    .icon-audit-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .icon-audit-copy { min-width: 0; }
    .icon-audit-copy span { display: block; margin-bottom: 4px; color: var(--muted); font-size: 11px; }
    .icon-audit-copy pre {
      min-height: 76px; margin: 0; padding: 9px; overflow: auto; border: 1px solid var(--line);
      border-radius: 6px; background: var(--surface); color: var(--text);
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
    }
    .icon-audit-icons { display: grid; gap: 5px; margin: 10px 0 0; padding: 0; list-style: none; }
    .icon-audit-icons li { color: var(--muted); font-size: 12px; }
    .icon-audit-icons code { color: var(--text); font-weight: 700; }
    .icon-audit-item-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .icon-audit-empty { color: var(--muted); font-size: 12px; }
    .hidden { display: none !important; }
    label.check { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
    button:focus-visible,
    textarea:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    textarea:focus-visible { border-color: var(--focus); }
    @media (max-width: 1050px) {
      .layout { grid-template-columns: 150px 1fr; }
      section.editor { grid-column: 1 / -1; height: 55vh; border-top: 1px solid var(--line); }
      .icon-audit-result, .icon-audit-compare { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-main">
      <h1>원문 이미지 · 추출문 검수</h1>
      <span id="project" class="status"></span>
      <div class="review-mode-switch" aria-label="검수 모드">
        <button id="editMode" class="active" type="button">텍스트 편집</button>
        <button id="selectMode" type="button">블록 편집</button>
      </div>
      <div class="grow"></div>
      <button id="addMissing" class="hidden" type="button">누락 문단 추가</button>
      <button id="iconAuditMode" class="hidden" type="button">아이콘 검사(AI)</button>
      <button id="iconAuditRun" class="primary hidden" type="button" disabled>선택한 블록 검사 (0)</button>
    </div>
    <div class="header-workflow">
      <button id="save">저장</button>
      <button id="validate">검증</button>
      <button id="finalize" class="primary">최종 승인</button>
    </div>
  </header>
  <div class="layout">
    <aside>
      <section id="unresolvedPanel" class="unresolved-panel" aria-labelledby="unresolvedTitle">
        <div class="unresolved-head">
          <h2 id="unresolvedTitle">검증 전 미해결</h2>
          <strong id="unresolvedTotal" class="unresolved-total">0</strong>
        </div>
        <div class="unresolved-counts">
          <span>미확정 아이콘</span><strong id="unresolvedIcons">0</strong>
          <span>판독 불가 문자</span><strong id="unresolvedIllegible">0</strong>
        </div>
        <button id="unresolvedFilter" class="filter-button" type="button"></button>
        <button id="approveUnresolvedIcons" class="override-button" type="button">
          미확정 아이콘 그대로 승인
        </button>
      </section>
      <button id="layoutWarningFilter" class="filter-button hidden"></button>
      <div id="groups"></div>
    </aside>
    <main>
      <div class="viewer-tools">
        <button id="openPdf" class="hidden">원본 PDF 열기</button>
        <label>확대 <input id="zoom" type="range" min="50" max="180" value="100"></label>
        <span id="bulkSelectHint" class="status hidden">블록을 클릭하세요. Shift+클릭으로 범위를 선택할 수 있습니다.</span>
        <span id="iconAuditHint" class="status hidden">검사할 블록을 클릭하세요. Shift+클릭으로 범위를 선택할 수 있습니다.</span>
        <span id="drawHint" class="status hidden">원본에서 누락 영역을 드래그하세요.</span>
        <span class="viewer-tools-spacer"></span>
        <button id="selectPageIcons" class="hidden" type="button">현재 페이지 전체 선택</button>
      </div>
      <div id="canvas" class="canvas">
        <img id="sourceImage" alt="원본 페이지">
        <div id="overlay" class="overlay"></div>
      </div>
    </main>
    <section class="editor">
      <div id="summary" class="summary"></div>
      <div id="cards"></div>
    </section>
  </div>
  <div id="bulkActions" class="bulk-actions hidden" aria-live="polite">
    <strong id="bulkSelectionCount">0개 선택됨</strong>
    <button id="bulkExclude" class="bulk-exclude" type="button">선택 제외</button>
    <button id="bulkRestore" type="button">선택 복원</button>
    <button id="bulkClear" type="button">선택 취소</button>
  </div>
  <dialog id="iconAuditDialog" class="icon-audit-dialog" aria-labelledby="iconAuditTitle">
    <h2 id="iconAuditTitle">아이콘 검사 결과</h2>
    <p id="iconAuditSummary"></p>
    <div id="iconAuditResults" class="icon-audit-results"></div>
    <div class="dialog-actions">
      <button id="iconAuditClose" type="button">닫기</button>
    </div>
  </dialog>
  <dialog id="approvalCompleteDialog" aria-labelledby="approvalCompleteTitle">
    <h2 id="approvalCompleteTitle">원문 승인이 완료되었습니다</h2>
    <p>
      다음 단계에서 승인된 원문을 기반으로 용어 후보를 생성할 수 있습니다.
    </p>
    <div class="dialog-actions">
      <button id="stayAfterApproval" type="button">이 화면에 머물기</button>
      <button id="returnDashboard" class="primary" type="button">
        대시보드로 돌아가기
      </button>
    </div>
  </dialog>
  <div id="notice" class="notice hidden"></div>
  <script>
    const TOKEN = __GLK_TOKEN_JSON__;
    const RETURN_URL = __GLK_RETURN_URL_JSON__;
    const MAX_ICON_AUDIT_BLOCKS = 24;
    let documentState = null;
    let currentGroup = null;
    let selectedId = null;
    let drawMode = false;
    let drawStart = null;
    let drawElement = null;
    let newCounter = 0;
    let layoutWarningsOnly = false;
    let unresolvedOnly = false;
    let bulkSelectMode = false;
    let bulkSelection = new Set();
    let bulkSelectionAnchorId = null;
    let draggedBlockIds = [];
    let iconAuditMode = false;
    let iconAuditBusy = false;
    let iconAuditSelection = new Set();
    let iconAuditSelectionAnchorId = null;
    let iconAuditResults = [];
    let iconAuditRunSummary = "";

    const $ = (id) => document.getElementById(id);
    const api = async (path, options = {}) => {
      const response = await fetch(path, {
        ...options,
        headers: {"X-GLK-Token": TOKEN, ...(options.headers || {})}
      });
      const body = await response.json();
      if (!response.ok) {
        const error = new Error(body.message || "요청에 실패했습니다.");
        error.code = body.code;
        error.detail = body.detail;
        throw error;
      }
      return body;
    };
    const notice = (message, error = false) => {
      $("notice").textContent = message;
      $("notice").className = `notice${error ? " error" : ""}`;
      clearTimeout(notice.timer);
      notice.timer = setTimeout(() => $("notice").classList.add("hidden"), 4200);
    };
    const unresolvedKinds = (block) => ({
      icon: !block.excluded && /\[ICON:\s*[^\]]+\]/i.test(block.text),
      illegible: !block.excluded && (
        /\[ILLEGIBLE\]/i.test(block.text) || block.text.includes("�")
      )
    });
    const isUnresolved = (block) => {
      const kinds = unresolvedKinds(block);
      return kinds.icon || kinds.illegible;
    };
    const unresolvedBlocks = () => documentState.blocks.filter(isUnresolved);
    const allGroupBlocks = () => documentState.blocks.filter((b) => b.group_id === currentGroup);
    const groupBlocks = () => allGroupBlocks().filter(
      (b) => (!iconAuditMode || !b.excluded) &&
        (!layoutWarningsOnly || b.layout_warnings) &&
        (!unresolvedOnly || isUnresolved(b))
    );
    const groupById = () => documentState.groups.find((g) => g.id === currentGroup);
    const iconAuditEligible = (block) => (
      documentState.source_type === "pdf" && block.source_type === "pdf" &&
      !block.manual && !block.excluded && Array.isArray(block.bbox)
    );
    const bulkSelectable = (block) => !block.manual;
    const blockDisplayNumber = (block) => (
      documentState.blocks.filter((item) => item.group_id === block.group_id)
        .findIndex((item) => item.id === block.id) + 1
    );

    function pruneBulkSelection() {
      const available = new Set(
        documentState.blocks.filter(bulkSelectable).map((block) => block.id)
      );
      for (const id of bulkSelection) {
        if (!available.has(id)) bulkSelection.delete(id);
      }
      if (!available.has(bulkSelectionAnchorId)) bulkSelectionAnchorId = null;
    }

    function renderBulkControls() {
      if (!documentState) return;
      pruneBulkSelection();
      $("editMode").classList.toggle("active", !bulkSelectMode);
      $("selectMode").classList.toggle("active", bulkSelectMode);
      $("bulkSelectHint").classList.toggle(
        "hidden",
        !bulkSelectMode || iconAuditMode || drawMode,
      );
      const selected = documentState.blocks.filter(
        (block) => bulkSelection.has(block.id) && bulkSelectable(block)
      );
      $("bulkActions").classList.toggle("hidden", !selected.length);
      $("bulkSelectionCount").textContent = `${selected.length}개 선택됨`;
      $("bulkExclude").disabled = !selected.some((block) => !block.excluded);
      $("bulkRestore").disabled = !selected.some((block) => block.excluded);
    }

    function setBulkBlockSelection(
      block,
      selected,
      extendRange = false,
      scrollToCard = false,
    ) {
      if (!bulkSelectMode || !bulkSelectable(block)) return;
      const visible = groupBlocks().filter(bulkSelectable);
      const anchorIndex = visible.findIndex(
        (item) => item.id === bulkSelectionAnchorId
      );
      const blockIndex = visible.findIndex((item) => item.id === block.id);
      if (extendRange && anchorIndex >= 0 && blockIndex >= 0) {
        const start = Math.min(anchorIndex, blockIndex);
        const end = Math.max(anchorIndex, blockIndex);
        for (const item of visible.slice(start, end + 1)) {
          if (selected) bulkSelection.add(item.id);
          else bulkSelection.delete(item.id);
        }
      } else if (selected) {
        bulkSelection.add(block.id);
      } else {
        bulkSelection.delete(block.id);
      }
      bulkSelectionAnchorId = block.id;
      renderCards();
      renderOverlay();
      renderBulkControls();
      if (scrollToCard) {
        document.querySelector(`[data-card="${CSS.escape(block.id)}"]`)
          ?.scrollIntoView({block: "center", behavior: "smooth"});
      }
    }

    function toggleBulkBlock(block, extendRange = false, scrollToCard = false) {
      setBulkBlockSelection(
        block,
        extendRange ? true : !bulkSelection.has(block.id),
        extendRange,
        scrollToCard,
      );
    }

    function applyBulkExcluded(excluded) {
      const selected = documentState.blocks.filter(
        (block) => bulkSelection.has(block.id) && bulkSelectable(block)
      );
      if (!selected.length) return;
      for (const block of selected) {
        block.excluded = excluded;
        if (excluded) iconAuditSelection.delete(block.id);
      }
      render();
      notice(`${selected.length}개 블록을 ${excluded ? "제외" : "복원"}했습니다.`);
    }

    function setIconAuditBlockSelection(block, selected, extendRange = false) {
      if (!iconAuditEligible(block) || iconAuditBusy) return;
      const visible = groupBlocks().filter(iconAuditEligible);
      const anchorIndex = visible.findIndex(
        (item) => item.id === iconAuditSelectionAnchorId
      );
      const blockIndex = visible.findIndex((item) => item.id === block.id);
      const targets = extendRange && anchorIndex >= 0 && blockIndex >= 0
        ? visible.slice(
            Math.min(anchorIndex, blockIndex),
            Math.max(anchorIndex, blockIndex) + 1,
          )
        : [block];
      let limitReached = false;
      for (const target of targets) {
        if (!selected) {
          iconAuditSelection.delete(target.id);
        } else if (
          iconAuditSelection.has(target.id)
          || iconAuditSelection.size < MAX_ICON_AUDIT_BLOCKS
        ) {
          iconAuditSelection.add(target.id);
        } else {
          limitReached = true;
        }
      }
      iconAuditSelectionAnchorId = block.id;
      if (limitReached) {
        notice(`한 번에 최대 ${MAX_ICON_AUDIT_BLOCKS}개 블록을 검사할 수 있습니다.`, true);
      }
      renderCards(); renderOverlay(); renderIconAuditControls();
    }

    function toggleIconAuditBlock(block, extendRange = false) {
      setIconAuditBlockSelection(
        block,
        extendRange ? true : !iconAuditSelection.has(block.id),
        extendRange,
      );
    }

    function renderIconAuditControls() {
      const available = documentState?.source_type === "pdf" && bulkSelectMode;
      const mode = $("iconAuditMode");
      mode.classList.toggle("hidden", !available);
      mode.textContent = iconAuditMode ? "아이콘 검사 종료" : "아이콘 검사(AI)";
      mode.disabled = iconAuditBusy;
      const run = $("iconAuditRun");
      run.classList.toggle("hidden", !available || !iconAuditMode);
      run.disabled = iconAuditBusy || !iconAuditSelection.size;
      run.textContent = iconAuditBusy
        ? "아이콘 검사 중…"
        : `선택한 블록 검사 (${iconAuditSelection.size})`;
      const page = $("selectPageIcons");
      page.classList.toggle("hidden", !available || !iconAuditMode);
      const eligible = allGroupBlocks().filter(iconAuditEligible);
      const pageHasSelection = eligible.some(
        (block) => iconAuditSelection.has(block.id)
      );
      page.disabled = iconAuditBusy || !eligible.length;
      page.textContent = pageHasSelection ? "현재 페이지 선택 해제" : "현재 페이지 전체 선택";
      $("iconAuditHint").classList.toggle("hidden", !iconAuditMode);
    }

    function renderGroups() {
      $("groups").innerHTML = "";
      for (const group of documentState.groups) {
        if (layoutWarningsOnly && !group.layout_warnings) continue;
        const groupItems = documentState.blocks.filter(
          (b) => b.group_id === group.id && !b.excluded
        );
        const unresolved = groupItems.filter(isUnresolved).length;
        if (unresolvedOnly && !unresolved) continue;
        const count = groupItems.length;
        const button = document.createElement("button");
        button.className = `group${group.id === currentGroup ? " active" : ""}`;
        button.title = group.label;
        const label = document.createElement("span");
        label.textContent = group.label;
        const total = document.createElement("span");
        total.className = `group-meta${group.layout_warnings ? " warning" : ""}`;
        total.textContent = unresolvedOnly
          ? `미해결 ${unresolved}`
          : group.layout_warnings
            ? `${count} · 누락 ${group.layout_warnings}`
            : count;
        button.append(label, total);
        button.onclick = () => {
          currentGroup = group.id;
          selectedId = null;
          bulkSelectionAnchorId = null;
          render();
        };
        $("groups").appendChild(button);
      }
    }

    function selectBlock(id) {
      selectedId = id;
      document.querySelectorAll("[data-card]").forEach((card) => {
        card.classList.toggle("selected", card.dataset.card === id);
      });
      renderOverlay();
      const card = document.querySelector(`[data-card="${CSS.escape(id)}"]`);
      if (card) card.scrollIntoView({block: "nearest", behavior: "smooth"});
    }

    function renderOverlay() {
      const overlay = $("overlay");
      overlay.innerHTML = "";
      for (const block of groupBlocks()) {
        if (!block.bbox) continue;
        const [x0,y0,x1,y1] = block.bbox;
        const box = document.createElement("div");
        box.className = `box${selectedId === block.id ? " selected" : ""}${bulkSelection.has(block.id) ? " bulk-selected" : ""}${iconAuditSelection.has(block.id) ? " icon-selected" : ""}${block.excluded ? " excluded" : ""}${block.warnings.length ? " warning" : ""}${block.issues.length ? " issue" : ""}`;
        box.style.left = `${x0/10}%`; box.style.top = `${y0/10}%`;
        box.style.width = `${(x1-x0)/10}%`; box.style.height = `${(y1-y0)/10}%`;
        box.title = block.text.slice(0, 100);
        const number = document.createElement("span");
        number.className = "box-number";
        number.textContent = blockDisplayNumber(block);
        box.appendChild(number);
        box.onclick = (event) => {
          event.stopPropagation();
          if (iconAuditMode) toggleIconAuditBlock(block, event.shiftKey);
          else if (bulkSelectMode) toggleBulkBlock(block, event.shiftKey, true);
          else selectBlock(block.id);
        };
        overlay.appendChild(box);
      }
    }

    function moveBlock(id, direction) {
      const index = documentState.blocks.findIndex((b) => b.id === id);
      const target = index + direction;
      if (index < 0 || target < 0 || target >= documentState.blocks.length) return;
      if (documentState.blocks[target].group_id !== currentGroup) return;
      [documentState.blocks[index], documentState.blocks[target]] =
        [documentState.blocks[target], documentState.blocks[index]];
      render();
    }

    function clearBlockDropIndicators() {
      document.querySelectorAll(".card.drop-before, .card.drop-after").forEach(
        (card) => card.classList.remove("drop-before", "drop-after")
      );
    }

    function draggedBlocksFor(block) {
      if (!bulkSelection.has(block.id)) return [block.id];
      return allGroupBlocks()
        .filter((item) => bulkSelection.has(item.id))
        .map((item) => item.id);
    }

    function startBlockDrag(event, block, card) {
      draggedBlockIds = draggedBlocksFor(block);
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", block.id);
      card.classList.add("dragging");
    }

    function autoScrollEditor(event) {
      const editor = document.querySelector("section.editor");
      const rect = editor.getBoundingClientRect();
      const edge = 64;
      if (event.clientY < rect.top + edge) {
        editor.scrollTop -= Math.ceil((rect.top + edge - event.clientY) / 5);
      } else if (event.clientY > rect.bottom - edge) {
        editor.scrollTop += Math.ceil((event.clientY - (rect.bottom - edge)) / 5);
      }
    }

    function showBlockDropTarget(event, block, card) {
      if (
        !draggedBlockIds.length
        || draggedBlockIds.includes(block.id)
        || block.group_id !== currentGroup
      ) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = "move";
      clearBlockDropIndicators();
      const rect = card.getBoundingClientRect();
      card.classList.add(
        event.clientY < rect.top + rect.height / 2 ? "drop-before" : "drop-after"
      );
      autoScrollEditor(event);
    }

    function reorderDraggedBlocks(targetId, insertAfter) {
      if (!draggedBlockIds.length || draggedBlockIds.includes(targetId)) return;
      const target = documentState.blocks.find((block) => block.id === targetId);
      if (!target || target.group_id !== currentGroup) return;
      const movingIds = new Set(draggedBlockIds);
      const moving = documentState.blocks.filter((block) => movingIds.has(block.id));
      if (!moving.length || moving.some((block) => block.group_id !== currentGroup)) return;
      const remaining = documentState.blocks.filter((block) => !movingIds.has(block.id));
      const targetIndex = remaining.findIndex((block) => block.id === targetId);
      if (targetIndex < 0) return;
      remaining.splice(targetIndex + Number(insertAfter), 0, ...moving);
      documentState.blocks = remaining;
      const count = moving.length;
      draggedBlockIds = [];
      render();
      notice(`${count}개 블록의 순서를 변경했습니다.`);
    }

    function finishBlockDrag() {
      draggedBlockIds = [];
      clearBlockDropIndicators();
      document.querySelectorAll(".card.dragging").forEach(
        (card) => card.classList.remove("dragging")
      );
    }

    function deleteManual(id) {
      documentState.blocks = documentState.blocks.filter((b) => b.id !== id);
      bulkSelection.delete(id);
      if (selectedId === id) selectedId = null;
      render();
    }

    function renderCards() {
      const cards = $("cards");
      cards.innerHTML = "";
      for (const block of groupBlocks()) {
        const card = document.createElement("div");
        card.dataset.card = block.id;
        card.className = `card${selectedId === block.id ? " selected" : ""}${bulkSelectMode ? " bulk-select-mode" : ""}${bulkSelection.has(block.id) ? " bulk-selected" : ""}${iconAuditSelection.has(block.id) ? " icon-selected" : ""}${block.excluded ? " excluded" : ""}`;
        const head = document.createElement("div");
        head.className = "card-head";
        head.innerHTML = `
          <span class="card-number" title="${block.id}">블록 ${blockDisplayNumber(block)}</span>
          ${block.manual ? '<span class="tag manual">수동 추가</span>' : ""}
          ${block.block_type === "unresolved_page" ? '<span class="tag issue">원문 직접 입력 필요</span>' : ""}
          ${block.layout_warnings ? `<span class="tag warning">AI 정렬 누락 ${block.layout_warnings}</span>` : ""}
          ${block.warnings.length - block.layout_warnings ? `<span class="tag warning">추출 경고 ${block.warnings.length - block.layout_warnings}</span>` : ""}
          ${block.issues.length ? `<span class="tag issue">QA ${block.issues.length}</span>` : ""}
          <span class="grow"></span>`;
        if (iconAuditMode) {
          const auditLabel = document.createElement("label");
          auditLabel.className = "check icon-audit-select";
          auditLabel.onclick = (event) => event.stopPropagation();
          const auditCheck = document.createElement("input");
          auditCheck.type = "checkbox";
          auditCheck.checked = iconAuditSelection.has(block.id);
          auditCheck.disabled = !iconAuditEligible(block) || iconAuditBusy;
          auditCheck.onclick = (event) => {
            event.stopPropagation();
            setIconAuditBlockSelection(
              block,
              auditCheck.checked,
              event.shiftKey,
            );
          };
          auditLabel.append(auditCheck, document.createTextNode(" 아이콘 검사"));
          head.appendChild(auditLabel);
        }
        if (bulkSelectMode && !iconAuditMode) {
          const handle = document.createElement("span");
          handle.className = "drag-handle";
          handle.textContent = "⠿";
          handle.title = bulkSelection.has(block.id)
            ? "선택한 블록을 함께 끌어 순서를 변경합니다."
            : "끌어서 블록 순서를 변경합니다.";
          handle.setAttribute("aria-hidden", "true");
          handle.draggable = true;
          handle.onclick = (event) => event.stopPropagation();
          handle.ondragstart = (event) => startBlockDrag(event, block, card);
          handle.ondragend = finishBlockDrag;
          head.appendChild(handle);
          const up = document.createElement("button"); up.className = "mini"; up.textContent = "↑";
          up.onclick = () => moveBlock(block.id, -1);
          const down = document.createElement("button"); down.className = "mini"; down.textContent = "↓";
          down.onclick = () => moveBlock(block.id, 1);
          head.append(up, down);
          if (block.manual) {
            const del = document.createElement("button"); del.className = "mini danger"; del.textContent = "삭제";
            del.onclick = () => deleteManual(block.id); head.appendChild(del);
          } else {
            const label = document.createElement("label"); label.className = "check";
            const check = document.createElement("input"); check.type = "checkbox"; check.checked = block.excluded;
            check.onchange = () => {
              block.excluded = check.checked;
              if (block.excluded) iconAuditSelection.delete(block.id);
              render();
            };
            label.append(check, document.createTextNode(" 제외")); head.appendChild(label);
          }
        }
        const area = document.createElement("textarea");
        area.value = block.text;
        area.disabled = block.excluded && !bulkSelectMode;
        area.readOnly = bulkSelectMode || block.excluded;
        area.title = iconAuditMode
          ? "아이콘 검사할 블록을 선택하거나 해제합니다."
          : bulkSelectMode
            ? "블록 편집: 클릭하여 작업 대상에 추가하거나 해제합니다."
            : "";
        area.onfocus = () => {
          if (!bulkSelectMode) selectBlock(block.id);
        };
        area.onclick = (event) => {
          if (iconAuditMode) {
            event.stopPropagation();
            toggleIconAuditBlock(block, event.shiftKey);
            return;
          }
          if (!bulkSelectMode || !bulkSelectable(block)) return;
          event.stopPropagation();
          toggleBulkBlock(block, event.shiftKey);
        };
        area.oninput = () => {
          block.text = area.value;
          renderUnresolvedStatus();
          if (unresolvedOnly) renderGroups();
        };
        card.onclick = (event) => {
          if (event.target.closest("button, input, textarea, label, .drag-handle")) return;
          if (iconAuditMode) {
            toggleIconAuditBlock(block, event.shiftKey);
          } else if (bulkSelectMode && bulkSelectable(block)) {
            toggleBulkBlock(block, event.shiftKey);
          } else {
            selectBlock(block.id);
          }
        };
        card.ondragover = (event) => showBlockDropTarget(event, block, card);
        card.ondragleave = (event) => {
          if (!card.contains(event.relatedTarget)) {
            card.classList.remove("drop-before", "drop-after");
          }
        };
        card.ondrop = (event) => {
          if (!draggedBlockIds.length || draggedBlockIds.includes(block.id)) return;
          event.preventDefault();
          const insertAfter = card.classList.contains("drop-after");
          reorderDraggedBlocks(block.id, insertAfter);
        };
        card.append(head, area);
        if (block.warnings.length) {
          const warning = document.createElement("div");
          warning.className = "source-warning";
          warning.textContent = block.warnings.join("\n");
          card.appendChild(warning);
        }
        if (block.issues.length) {
          const issue = document.createElement("div");
          issue.className = "status";
          issue.textContent = block.issues.map((i) => i.message || i.code).join(" · ");
          card.appendChild(issue);
        }
        cards.appendChild(card);
      }
    }

    function renderSource() {
      const group = groupById();
      if (!group) return;
      const imageUrl = `${group.image_url}&token=${encodeURIComponent(TOKEN)}`;
      if ($("sourceImage").getAttribute("src") !== imageUrl) {
        $("sourceImage").src = imageUrl;
      }
      $("canvas").style.width = `${$("zoom").value}%`;
      $("sourceImage").style.width = "100%";
      $("openPdf").classList.toggle("hidden", !documentState.original_pdf_url);
    }

    function renderSummary() {
      const s = {
        blocks: documentState.blocks.length,
        excluded: documentState.blocks.filter((b) => b.excluded).length,
        manual: documentState.blocks.filter((b) => b.manual).length,
        changed: documentState.blocks.filter((b) => b.manual || b.text !== b.raw_text).length,
        warnings: documentState.blocks.reduce((total, b) => total + b.warnings.length, 0),
        layoutWarnings: documentState.blocks.reduce((total, b) => total + b.layout_warnings, 0),
        issues: documentState.blocks.reduce((total, b) => total + b.issues.length, 0)
      };
      const reviewStatusLabel = {
        prepared: "검수 준비됨",
        current: "최신 상태",
        stale: "업데이트 필요",
        approved: "승인 완료"
      }[documentState.review_status] || "상태 확인 필요";
      $("project").textContent = `${documentState.project_name} · ${reviewStatusLabel}`;
      $("summary").textContent = `전체 ${s.blocks} · 제외 ${s.excluded} · 수동 ${s.manual} · 수정 ${s.changed} · AI 정렬 누락 ${s.layoutWarnings} · 기타 추출 경고 ${s.warnings - s.layoutWarnings} · QA ${s.issues}`;
      const filter = $("layoutWarningFilter");
      filter.classList.toggle("hidden", !s.layoutWarnings);
      filter.classList.toggle("active", layoutWarningsOnly);
      filter.textContent = layoutWarningsOnly
        ? "전체 블록 보기"
        : `AI 정렬 누락만 보기 (${s.layoutWarnings})`;
      renderUnresolvedStatus();
    }

    function renderUnresolvedStatus() {
      const blocks = unresolvedBlocks();
      const counts = blocks.reduce((result, block) => {
        const kinds = unresolvedKinds(block);
        result.icons += Number(kinds.icon);
        result.illegible += Number(kinds.illegible);
        return result;
      }, {icons: 0, illegible: 0});
      $("unresolvedTotal").textContent = blocks.length;
      $("unresolvedIcons").textContent = counts.icons;
      $("unresolvedIllegible").textContent = counts.illegible;
      $("unresolvedPanel").classList.toggle("complete", !blocks.length);
      const filter = $("unresolvedFilter");
      filter.classList.toggle("active", unresolvedOnly);
      filter.disabled = !blocks.length && !unresolvedOnly;
      filter.textContent = unresolvedOnly
        ? "전체 블록 보기"
        : blocks.length
          ? `미해결 항목만 보기 (${blocks.length})`
          : "미해결 항목 없음";
      const approve = $("approveUnresolvedIcons");
      approve.classList.toggle("hidden", !counts.icons);
      approve.textContent = counts.icons
        ? `미확정 아이콘 ${counts.icons}개 그대로 승인`
        : "미확정 아이콘 그대로 승인";
    }

    function render() {
      renderGroups(); renderSource(); renderCards(); renderOverlay(); renderSummary();
      renderIconAuditControls(); renderBulkControls();
      const addMissing = $("addMissing");
      addMissing.classList.toggle(
        "hidden",
        !bulkSelectMode || iconAuditMode,
      );
      addMissing.disabled = false;
      addMissing.title = "원본 이미지에서 누락된 문단 영역을 추가합니다.";
    }

    function normalizedPoint(event) {
      const rect = $("sourceImage").getBoundingClientRect();
      return [
        Math.max(0, Math.min(1000, (event.clientX - rect.left) / rect.width * 1000)),
        Math.max(0, Math.min(1000, (event.clientY - rect.top) / rect.height * 1000))
      ];
    }

    function setDrawMode(active) {
      drawMode = active;
      if (!active) {
        drawStart = null;
        drawElement?.remove();
        drawElement = null;
      }
      $("overlay").classList.toggle("drawing", active);
      $("drawHint").classList.toggle("hidden", !active);
      $("bulkSelectHint").classList.toggle(
        "hidden",
        !bulkSelectMode || active || iconAuditMode,
      );
      $("addMissing").classList.toggle("active", active);
      $("addMissing").textContent = active ? "추가 취소" : "누락 문단 추가";
    }

    $("addMissing").onclick = () => {
      if (drawMode) {
        setDrawMode(false);
        renderOverlay();
        notice("누락 문단 추가를 취소했습니다.");
        return;
      }
      layoutWarningsOnly = false;
      unresolvedOnly = false;
      bulkSelection.clear();
      bulkSelectionAnchorId = null;
      iconAuditMode = false;
      iconAuditSelection.clear();
      iconAuditSelectionAnchorId = null;
      render();
      setDrawMode(true);
      notice("원본 이미지에서 누락된 문단 영역을 드래그하세요.");
    };
    $("overlay").onpointerdown = (event) => {
      if (!drawMode || (event.pointerType === "mouse" && event.button !== 0)) return;
      event.preventDefault(); drawStart = normalizedPoint(event);
      drawElement = document.createElement("div"); drawElement.className = "draw-box";
      $("overlay").appendChild(drawElement);
      $("overlay").setPointerCapture(event.pointerId);
    };
    $("overlay").onpointermove = (event) => {
      if (!drawStart || !drawElement) return;
      const point = normalizedPoint(event);
      const x0 = Math.min(drawStart[0], point[0]), y0 = Math.min(drawStart[1], point[1]);
      const x1 = Math.max(drawStart[0], point[0]), y1 = Math.max(drawStart[1], point[1]);
      Object.assign(drawElement.style, {left:`${x0/10}%`,top:`${y0/10}%`,width:`${(x1-x0)/10}%`,height:`${(y1-y0)/10}%`});
    };
    $("overlay").onpointerup = (event) => {
      if (!drawStart) return;
      const end = normalizedPoint(event);
      const bbox = [Math.min(drawStart[0],end[0]), Math.min(drawStart[1],end[1]), Math.max(drawStart[0],end[0]), Math.max(drawStart[1],end[1])];
      setDrawMode(false);
      if (bbox[2]-bbox[0] < 5 || bbox[3]-bbox[1] < 5) { renderOverlay(); notice("조금 더 큰 영역을 선택하세요.", true); return; }
      const group = groupById();
      const block = {
        id: `new-${++newCounter}`, group_id: group.id, source_type: group.source_type,
        source_file: group.source_file, page: group.page, block_type: "paragraph",
        text: "", raw_text: "", bbox, manual: true, excluded: false, changed: true,
        warnings: [], layout_warnings: 0, issues: []
      };
      const groupItems = allGroupBlocks();
      const anchor = selectedId ? documentState.blocks.findIndex((b) => b.id === selectedId) : -1;
      const lastGroupBlock = groupItems[groupItems.length - 1];
      const fallback = lastGroupBlock
        ? documentState.blocks.lastIndexOf(lastGroupBlock) + 1
        : documentState.blocks.length;
      documentState.blocks.splice(anchor >= 0 ? anchor + 1 : fallback, 0, block);
      bulkSelectMode = false;
      selectedId = block.id; render();
      setTimeout(() => document.querySelector(`[data-card="${CSS.escape(block.id)}"] textarea`)?.focus(), 0);
    };
    $("overlay").onpointercancel = () => {
      if (!drawMode) return;
      setDrawMode(false);
      renderOverlay();
      notice("누락 문단 추가가 취소되었습니다.", true);
    };
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape" || !drawMode) return;
      setDrawMode(false);
      renderOverlay();
      notice("누락 문단 추가를 취소했습니다.");
    });

    function addAuditCopy(parent, label, value) {
      const column = document.createElement("div");
      column.className = "icon-audit-copy";
      const title = document.createElement("span");
      title.textContent = label;
      const copy = document.createElement("pre");
      copy.textContent = value;
      column.append(title, copy);
      parent.appendChild(column);
    }

    function applyIconAuditResult(result, card) {
      const block = documentState.blocks.find((item) => item.id === result.block_id);
      if (!block) {
        notice("검사한 원문 블록을 찾지 못했습니다. 다시 검사하세요.", true);
        return;
      }
      if (block.text !== result.current_text) {
        notice("검사 후 원문이 변경되었습니다. 해당 블록을 다시 검사하세요.", true);
        return;
      }
      block.text = result.suggested_text;
      result.applied = true;
      card.classList.add("applied");
      render();
      renderIconAuditResults();
      notice(`PAGE ${result.page} 아이콘 제안을 적용했습니다.`);
    }

    function renderIconAuditResults() {
      $("iconAuditSummary").textContent = iconAuditRunSummary;
      const host = $("iconAuditResults");
      host.replaceChildren();
      for (const result of iconAuditResults) {
        const sourceBlock = documentState.blocks.find(
          (block) => block.id === result.block_id
        );
        const displayNumber = sourceBlock ? blockDisplayNumber(sourceBlock) : "?";
        const card = document.createElement("article");
        card.className = `icon-audit-result${result.applied ? " applied" : ""}`;
        const crop = document.createElement("div");
        crop.className = "icon-audit-crop";
        const image = document.createElement("img");
        image.alt = `PAGE ${result.page} 블록 ${displayNumber} 원본 영역`;
        image.src = `${result.crop_url}&token=${encodeURIComponent(TOKEN)}`;
        crop.appendChild(image);

        const detail = document.createElement("div");
        detail.className = "icon-audit-detail";
        const head = document.createElement("div");
        head.className = "icon-audit-head";
        const title = document.createElement("strong");
        title.textContent = `PAGE ${result.page} · 블록 ${displayNumber}`;
        const state = document.createElement("span");
        state.className = "tag";
        state.textContent = result.applied
          ? "적용됨"
          : result.cached
          ? result.icons.length
            ? `저장된 결과 · 아이콘 ${result.icons.length}개`
            : "저장된 결과 · 아이콘 없음"
          : result.icons.length
          ? `아이콘 ${result.icons.length}개`
          : "아이콘 없음";
        head.append(title, state);
        detail.appendChild(head);

        const compare = document.createElement("div");
        compare.className = "icon-audit-compare";
        addAuditCopy(compare, "현재 원문", result.current_text);
        addAuditCopy(compare, "AI 제안", result.suggested_text);
        detail.appendChild(compare);

        if (result.icons.length) {
          const icons = document.createElement("ul");
          icons.className = "icon-audit-icons";
          for (const icon of result.icons) {
            const item = document.createElement("li");
            const marker = document.createElement("code");
            marker.textContent = icon.marker;
            const confidence = {
              high: "높은 신뢰도",
              medium: "중간 신뢰도",
              low: "낮은 신뢰도"
            }[icon.confidence] || "신뢰도 확인 필요";
            item.append(
              marker,
              document.createTextNode(` · ${icon.description} · ${confidence}`)
            );
            icons.appendChild(item);
          }
          detail.appendChild(icons);
          const actions = document.createElement("div");
          actions.className = "icon-audit-item-actions";
          const apply = document.createElement("button");
          apply.type = "button";
          apply.className = "primary";
          apply.textContent = "적용";
          apply.disabled = result.applied;
          apply.onclick = () => applyIconAuditResult(result, card);
          actions.appendChild(apply);
          detail.appendChild(actions);
        } else {
          const empty = document.createElement("p");
          empty.className = "icon-audit-empty";
          empty.textContent = result.summary || "의미 있는 누락 아이콘을 찾지 못했습니다.";
          detail.appendChild(empty);
        }
        card.append(crop, detail);
        host.appendChild(card);
      }
    }

    async function runPdfIconAudit() {
      const selected = documentState.blocks.filter(
        (block) => iconAuditSelection.has(block.id) && iconAuditEligible(block)
      );
      if (!selected.length || iconAuditBusy) return;
      iconAuditBusy = true;
      renderCards(); renderOverlay(); renderIconAuditControls();
      try {
        const result = await api("/api/icon-audit", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            review_sha256: documentState.review_sha256,
            blocks: selected.map((block) => ({id: block.id, text: block.text}))
          })
        });
        iconAuditResults = result.results;
        const usage = result.usage;
        const thinkingLabel = usage && usage.thinking_tokens > 0
          ? ` (thinking ${usage.thinking_tokens} 포함)`
          : "";
        const cachedInputLabel = usage && usage.cached_input_tokens > 0
          ? ` · cached input ${usage.cached_input_tokens} token`
          : "";
        const usageLabel = usage && Number.isInteger(usage.requests) && usage.requests > 0
          ? ` · API ${usage.requests}회 · 입력 ${usage.input_tokens || 0} token · 출력 ${usage.output_tokens || 0} token${thinkingLabel}${cachedInputLabel}`
          : "";
        const costLabel = usage && usage.requests > 0
          ? Number.isFinite(usage.estimated_cost_usd)
            ? ` · 예상 비용 $${usage.estimated_cost_usd < 0.0001
                ? usage.estimated_cost_usd.toFixed(6)
                : usage.estimated_cost_usd.toFixed(4)}`
            : " · 예상 비용 단가 미등록"
          : result.cached_blocks
            ? " · 추가 비용 $0 (저장 결과 재사용)"
            : "";
        const cacheLabel = result.cached_blocks
          ? ` · 저장된 결과 ${result.cached_blocks}개 재사용`
          : "";
        iconAuditRunSummary = `${result.inspected_blocks}개 블록 검사 · 아이콘 ${result.detected_icons}개 감지${cacheLabel}${usageLabel}${costLabel}`;
        iconAuditMode = false;
        iconAuditSelection.clear();
        iconAuditSelectionAnchorId = null;
        render();
        renderIconAuditResults();
        $("iconAuditDialog").showModal();
      } catch (error) {
        notice(error.message, true);
      } finally {
        iconAuditBusy = false;
        renderIconAuditControls();
      }
    }

    $("iconAuditMode").onclick = () => {
      iconAuditMode = !iconAuditMode;
      iconAuditSelection.clear();
      iconAuditSelectionAnchorId = null;
      if (iconAuditMode) {
        bulkSelection.clear();
        bulkSelectionAnchorId = null;
        layoutWarningsOnly = false;
        unresolvedOnly = false;
        setDrawMode(false);
      }
      render();
    };
    function setReviewMode(mode) {
      const selecting = mode === "select";
      if (bulkSelectMode === selecting && !iconAuditMode && !drawMode) return;
      const selectedBlocks = documentState.blocks.filter(
        (block) => bulkSelection.has(block.id)
      );
      bulkSelectMode = selecting;
      bulkSelection.clear();
      bulkSelectionAnchorId = null;
      iconAuditMode = false;
      iconAuditSelection.clear();
      iconAuditSelectionAnchorId = null;
      setDrawMode(false);
      if (selecting) {
        selectedId = null;
        layoutWarningsOnly = false;
        unresolvedOnly = false;
      } else if (selectedBlocks.length === 1) {
        currentGroup = selectedBlocks[0].group_id;
        selectedId = selectedBlocks[0].id;
      } else {
        selectedId = null;
      }
      render();
      if (!selecting && selectedBlocks.length === 1) {
        const area = document.querySelector(
          `[data-card="${CSS.escape(selectedBlocks[0].id)}"] textarea`
        );
        area?.scrollIntoView({block: "center", behavior: "smooth"});
        if (!area?.disabled) area?.focus({preventScroll: true});
      }
    }
    $("editMode").onclick = () => setReviewMode("edit");
    $("selectMode").onclick = () => setReviewMode("select");
    $("bulkExclude").onclick = () => applyBulkExcluded(true);
    $("bulkRestore").onclick = () => applyBulkExcluded(false);
    $("bulkClear").onclick = () => {
      bulkSelection.clear();
      bulkSelectionAnchorId = null;
      renderCards();
      renderOverlay();
      renderBulkControls();
    };
    $("iconAuditRun").onclick = runPdfIconAudit;
    $("selectPageIcons").onclick = () => {
      const eligible = allGroupBlocks().filter(iconAuditEligible);
      const pageHasSelection = eligible.some(
        (block) => iconAuditSelection.has(block.id)
      );
      for (const block of eligible) {
        if (pageHasSelection) iconAuditSelection.delete(block.id);
        else if (iconAuditSelection.size < MAX_ICON_AUDIT_BLOCKS) {
          iconAuditSelection.add(block.id);
        }
      }
      iconAuditSelectionAnchorId = null;
      if (!pageHasSelection && eligible.some((block) => !iconAuditSelection.has(block.id))) {
        notice(`현재 페이지에서 최대 ${MAX_ICON_AUDIT_BLOCKS}개 블록을 선택했습니다.`);
      }
      renderCards(); renderOverlay(); renderIconAuditControls();
    };
    $("iconAuditClose").onclick = () => $("iconAuditDialog").close();

    const iconTokens = (text) => (
      text.match(/\[(?!(?:ICON|ILLEGIBLE)\])[A-Z][A-Z0-9_]*\]/g) || []
    ).sort();
    const tokenChangeBlocks = () => documentState.blocks.filter((block) => (
      !block.manual && !block.excluded &&
      JSON.stringify(iconTokens(block.text)) !== JSON.stringify(iconTokens(block.raw_text))
    ));

    function payload({allowUnresolvedIcons = false, allowTokenChanges = false} = {}) {
      return {
        review_sha256: documentState.review_sha256,
        allow_token_changes: allowTokenChanges,
        allow_unresolved_icons: allowUnresolvedIcons,
        blocks: documentState.blocks.map((b) => ({
          id: b.id, text: b.text, excluded: b.excluded, source_type: b.source_type,
          source_file: b.source_file, page: b.page, bbox: b.bbox
        }))
      };
    }
    function unresolvedTextBlocker({allowUnresolvedIcons = false} = {}) {
      for (const block of unresolvedBlocks()) {
        const kinds = unresolvedKinds(block);
        if (kinds.icon && !allowUnresolvedIcons) {
          return {
            block,
            message: "미확정 아이콘([ICON: ...])이 남아 있습니다. 원본을 확인해 정의된 [TOKEN]으로 바꾸거나, 의미 없는 장식 아이콘이면 해당 표기를 삭제하세요."
          };
        }
        if (kinds.illegible) {
          return {
            block,
            message: "판독 불가 문자가 남아 있습니다. 원본을 확인해 텍스트를 수정하거나, 불필요한 블록이면 제외하세요."
          };
        }
      }
      return null;
    }
    function showBlocker(blocker) {
      layoutWarningsOnly = false;
      unresolvedOnly = true;
      currentGroup = blocker.block.group_id;
      selectedId = blocker.block.id;
      render();
      const area = document.querySelector(
        `[data-card="${CSS.escape(blocker.block.id)}"] textarea`
      );
      area?.scrollIntoView({block: "center", behavior: "smooth"});
      area?.focus({preventScroll: true});
      notice(blocker.message, true);
    }
    async function mutate(path, label, options = {}) {
      if (path !== "/api/save") {
        const blocker = unresolvedTextBlocker(options);
        if (blocker) {
          showBlocker(blocker);
          return null;
        }
        const changedTokens = tokenChangeBlocks();
        if (!options.allowTokenChanges && changedTokens.length) {
          const confirmed = confirm(
            `아이콘 token이 변경된 블록이 ${changedTokens.length}개 있습니다.\n\n`
            + "원본 이미지와 대조한 변경이 맞습니까?"
          );
          if (!confirmed) return null;
          options = {...options, allowTokenChanges: true};
        }
      }
      try {
        const result = await api(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload(options))});
        documentState = result.document;
        currentGroup = documentState.groups.some((g) => g.id === currentGroup) ? currentGroup : documentState.groups[0]?.id;
        selectedId = null; render(); notice(label); return result;
      } catch (error) { notice(error.message, true); return null; }
    }
    $("save").onclick = () => mutate("/api/save", "저장했습니다.");
    $("validate").onclick = () => mutate("/api/validate", "검증을 통과했습니다.");
    $("unresolvedFilter").onclick = () => {
      unresolvedOnly = !unresolvedOnly;
      if (unresolvedOnly) {
        layoutWarningsOnly = false;
        currentGroup = unresolvedBlocks()[0]?.group_id || currentGroup;
      }
      selectedId = null;
      render();
    };
    $("approveUnresolvedIcons").onclick = async () => {
      const blocks = unresolvedBlocks();
      const iconBlocks = blocks.filter((block) => unresolvedKinds(block).icon);
      const illegible = blocks.find((block) => unresolvedKinds(block).illegible);
      if (illegible) {
        showBlocker({
          block: illegible,
          message: "미확정 아이콘은 그대로 승인할 수 있지만, [ILLEGIBLE] 또는 깨진 문자는 실제 원문 손실이므로 먼저 수정하거나 해당 블록을 제외해야 합니다."
        });
        return;
      }
      if (!iconBlocks.length) return;
      const confirmed = confirm(
        `미확정 아이콘 표기 ${iconBlocks.length}개를 수정하지 않고 그대로 승인할까요?\n\n`
        + "[ICON: ...] 설명은 후속 번역에서도 원문 표기로 보존됩니다."
      );
      if (!confirmed) return;
      const result = await mutate(
        "/api/finalize",
        `미확정 아이콘 ${iconBlocks.length}개를 그대로 두고 원문을 승인했습니다.`,
        {allowUnresolvedIcons: true}
      );
      if (result) $("approvalCompleteDialog").showModal();
    };
    $("layoutWarningFilter").onclick = () => {
      layoutWarningsOnly = !layoutWarningsOnly;
      if (layoutWarningsOnly) unresolvedOnly = false;
      if (layoutWarningsOnly && !groupById()?.layout_warnings) {
        currentGroup = documentState.groups.find((group) => group.layout_warnings)?.id || currentGroup;
      }
      selectedId = null;
      render();
    };
    $("finalize").onclick = async () => {
      const layoutWarnings = documentState.blocks.reduce(
        (total, block) => total + block.layout_warnings,
        0
      );
      const message = layoutWarnings
        ? `AI가 정렬 중 누락해 자동 복구한 원문이 ${layoutWarnings}건 있습니다. 원본 이미지에서 위치와 순서를 확인했다면 최종 승인하세요.`
        : "현재 원문을 최종 승인할까요?";
      if (!confirm(message)) return;
      const result = await mutate("/api/finalize", "최종 원문을 승인했습니다.");
      if (result) $("approvalCompleteDialog").showModal();
    };
    $("stayAfterApproval").onclick = () => $("approvalCompleteDialog").close();
    $("returnDashboard").classList.toggle("hidden", !RETURN_URL);
    $("returnDashboard").onclick = () => {
      if (RETURN_URL) window.location.assign(RETURN_URL);
    };
    $("openPdf").onclick = () => window.open(`${documentState.original_pdf_url}?token=${encodeURIComponent(TOKEN)}`, "_blank", "noopener");
    $("zoom").oninput = () => renderSource();
    $("sourceImage").onload = renderOverlay;

    (async () => {
      try {
        documentState = await api("/api/review");
        const firstUnresolved = documentState.blocks.find(isUnresolved);
        currentGroup = (
          documentState.groups.find((group) => group.id === firstUnresolved?.group_id)
          || documentState.groups.find((group) => group.layout_warnings)
          || documentState.groups[0]
        )?.id || null;
        render();
      } catch (error) { notice(error.message, true); }
    })();
  </script>
</body>
</html>
