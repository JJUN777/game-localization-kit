[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-localization-kit"
version = "1.1.0"
description = "Cross-platform CLI toolkit for game localization workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-genai>=1.60,<2",
  "Pillow>=12.1,<13",
  "PyPDF2>=3.0,<4",
  "PyMuPDF>=1.28,<2",
  "python-dotenv>=1.2,<2",
  "send2trash>=1.8,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.20,<2",
  "types-Send2Trash>=1.8,<3",
]

[project.scripts]
glk = "glk.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"glk.web" = ["*.html"]
"glk.templates" = ["*.txt"]
"glk.data" = ["*.json"]

[tool.mypy]
python_version = "3.10"
follow_imports = "skip"
files = [
  "src/glk/error_response.py",
  "src/glk/application/ai_model_catalog.py",
  "src/glk/application/ai_settings_service.py",
  "src/glk/application/dashboard_job_service.py",
  "src/glk/application/review_types.py",
  "src/glk/application/dashboard_service.py",
  "src/glk/application/source_registration_service.py",
  "src/glk/application/source_review_service.py",
  "src/glk/application/glossary_review_service.py",
  "src/glk/application/translation_prompt_service.py",
  "src/glk/application/translation_restart_service.py",
  "src/glk/application/translation_retry_job_service.py",
  "src/glk/application/translation_review_service.py",
  "src/glk/infrastructure/source_review_server.py",
  "src/glk/infrastructure/glossary_review_server.py",
  "src/glk/infrastructure/translation_review_server.py",
  "src/glk/infrastructure/dashboard_server.py",
]
