[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-localization-kit"
version = "1.0.0"
description = "Cross-platform CLI toolkit for game localization workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-genai",
  "Pillow",
  "PyPDF2",
  "PyMuPDF",
  "python-dotenv",
]

[project.scripts]
glk = "glk.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"glk.web" = ["*.html"]
"glk.templates" = ["*.txt"]
